<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Our Civic Duty</title>
    <link rel="stylesheet" href="play.css" />
  </head>
  <body>
    <main id="game">
      <div id="stage">
        <img id="backdrop" alt="" />
        <img id="backdrop-next" alt="" />
      </div>

      <div id="here"></div>

      <div id="news-surface" class="panel toast" hidden>
        <button id="news-surface-open" type="button">
          <span id="news-surface-label" class="label"></span>
          <span id="news-surface-headline" class="prose"></span>
        </button>
        <span data-close="news-surface-close"></span>
      </div>
      <!-- Election morning: the narrator, a candidate's canvass, and the choice to vote. -->
      <section id="election-day" class="panel" hidden>
        <div id="election-day-lines"></div>
        <div id="election-day-acts" class="acts"></div>
      </section>
      <!-- Election night: the returns for the player's race, place by place. -->
      <section id="returns" class="panel" hidden></section>
      <!-- Election day at the polls: the ballot, from the elections engine's records. -->
      <section id="ballot" class="panel" hidden></section>
      <section id="meeting" class="panel" hidden>
        <h2 id="meeting-title" class="heading"></h2>
        <div id="meeting-items"></div>
        <div class="acts">
          <button id="meeting-adjourn" class="action" type="button"></button>
        </div>
      </section>
      <section id="desk" class="panel" hidden>
        <div id="desk-items"></div>
      </section>
      <section id="news-reader" class="panel" hidden>
        <div class="news-reader-main">
          <header class="paper-masthead">
            <h2 id="news-reader-masthead"></h2>
            <span id="news-reader-date" class="paper-date"></span>
          </header>
          <h2 id="news-reader-headline" class="heading"></h2>
          <div id="news-reader-body"></div>
        </div>
        <div>
          <div class="acts">
            <span data-close="news-reader-close"></span>
          </div>
          <div id="news-reader-more"></div>
        </div>
      </section>

      <section id="front" class="panel menu" data-testid="title-menu">
        <span data-close="front-close" data-testid="front-close"></span>
        <h1 class="title">Our Civic Duty</h1>
        <!-- The title menu as the Oct 12 title had it (TitleScreen.tsx, 29be9982f5^). -->
        <div id="front-main">
          <button
            id="front-continue"
            class="item"
            type="button"
            data-testid="continue"
            disabled
          >
            <span
              id="front-continue-bust"
              class="bust"
              data-testid="continue-face"
            ></span
            ><span class="continue-text"><b></b></span>
          </button>
          <button
            id="new-life"
            class="item"
            type="button"
            data-testid="new-game"
          >
            <b>New game</b>
          </button>
          <button
            id="front-saves"
            class="item"
            type="button"
            data-testid="open-saves"
          >
            <b>Saved games</b>
          </button>
          <button
            id="front-options"
            class="item"
            type="button"
            data-testid="title-options"
          >
            <b>Options</b>
          </button>
          <button
            id="front-patch-notes"
            class="item"
            type="button"
            data-testid="title-patch-notes"
          >
            <b>Patch notes</b>
          </button>
          <!-- Quit is the desktop's; a browser tab has none to offer. -->
          <button
            id="front-quit"
            class="item"
            type="button"
            data-testid="quit"
            hidden
          >
            <b>Quit</b>
          </button>
        </div>
        <!-- New game: how the world begins. -->
        <div id="front-new" data-testid="new-game-choice" hidden>
          <button
            id="new-start"
            class="item"
            type="button"
            data-testid="start-life"
          >
            <span id="new-start-busts" class="new-busts"></span>
            <b>Start a life</b>
          </button>
          <button
            id="new-advanced"
            class="item"
            type="button"
            data-testid="advanced"
          >
            <span id="new-advanced-busts" class="new-busts"></span>
            <b>Advanced</b>
          </button>
        </div>
        <!-- Advanced: the one dev-mode start (owner, Oct 26): the world's settings, then anyone to play as. -->
        <div
          id="front-advanced"
          data-testid="advanced-panel"
          class="strip-screen"
          hidden
        >
          <div class="mx3col">
            <section class="sec strips dp1">
              <h3 class="sechead">When it starts</h3>
              <div class="secbody">
                <label class="field"
                  >Opening day <input id="date" type="date" readonly
                /></label>
              </div>
            </section>
            <section class="sec strips dp2">
              <h3 class="sechead">This world</h3>
              <div class="secbody">
                <div class="field">
                  <label for="seed">World</label>
                  <span class="seed-row"
                    ><input id="seed" /><button
                      id="seed-random"
                      class="action small"
                      type="button"
                      data-testid="seed-random"
                    >
                      Another world
                    </button></span
                  >
                </div>
              </div>
            </section>
          </div>
          <div class="mx3col">
            <section class="sec strips dp1">
              <h3 class="sechead">The world</h3>
              <div class="secbody">
                <div id="world-rows"></div>
              </div>
            </section>
            <div class="acts">
              <button
                id="new-world"
                class="action small"
                type="button"
                data-testid="new-world"
              >
                New world
              </button>
              <button
                id="advanced-build"
                class="action primary small"
                type="button"
                data-testid="advanced-build"
              >
                Choose who to play
              </button>
            </div>
          </div>
        </div>
        <!-- Advanced, after the world is built: step into anyone who holds an office. -->
        <div
          id="front-pick"
          data-testid="advanced-pick"
          class="strip-screen"
          hidden
        >
          <div class="mx3col">
            <input
              id="pick-search"
              type="search"
              aria-label="Search officeholders"
              placeholder="Search officeholders"
            />
            <div id="pick-list" class="pick-list"></div>
          </div>
          <div id="pick-detail" class="mx3col"></div>
        </div>
        <!-- The creator: one screen (the Nov 8 front mock): the bust, who I am, where I'm from, how I look. -->
        <div id="cr-screen" class="strip-screen" hidden>
          <div id="cr-figure" class="mx3left">
            <div id="cr-bust" data-testid="creator-bust"></div>
            <p id="cr-figure-name" class="strip-name"></p>
            <button id="cr-randomize" class="action small" type="button">
              Random
            </button>
          </div>
          <div class="mx3col">
            <section class="sec strips dp1">
              <h3 class="sechead">Who I am</h3>
              <div class="secbody">
                <div id="cr-character" data-testid="creator-stage-character">
                  <div
                    class="group row"
                    role="group"
                    aria-labelledby="cr-gender-label"
                    data-testid="gender-choices"
                  >
                    <span id="cr-gender-label" class="label">I am</span>
                    <div class="choices">
                      <button
                        type="button"
                        class="action small"
                        data-gender="female"
                        data-testid="gender-female"
                      >
                        Female
                      </button>
                      <button
                        type="button"
                        class="action small"
                        data-gender="male"
                        data-testid="gender-male"
                      >
                        Male
                      </button>
                      <button
                        type="button"
                        class="action small"
                        data-gender="nonbinary"
                        data-testid="gender-nonbinary"
                      >
                        Non-binary
                      </button>
                    </div>
                  </div>
                  <div class="group" data-testid="creator-name">
                    <span class="label">Name</span>
                    <label class="field"
                      >First name
                      <input id="cr-given" maxlength="40" autocomplete="off"
                    /></label>
                    <label class="field"
                      >Last name
                      <input id="cr-family" maxlength="40" autocomplete="off"
                    /></label>
                    <button
                      id="cr-random-name"
                      class="action small"
                      type="button"
                      data-testid="creator-randomize-name"
                    >
                      Randomize name
                    </button>
                  </div>
                  <div
                    class="group row"
                    role="group"
                    aria-labelledby="cr-birthday-label"
                    data-testid="creator-birthday"
                  >
                    <span id="cr-birthday-label" class="label">Birthday</span>
                    <div class="date-row">
                      <label class="field"
                        >Month
                        <select
                          id="cr-month"
                          data-testid="start-birth-month"
                        ></select
                      ></label>
                      <label class="field"
                        >Day
                        <select
                          id="cr-day"
                          data-testid="start-birth-day"
                        ></select
                      ></label>
                      <label class="field"
                        >Year
                        <select
                          id="cr-year"
                          data-testid="start-birth-year"
                        ></select
                      ></label>
                    </div>
                    <button
                      id="cr-random-birthday"
                      class="action small"
                      type="button"
                      data-testid="creator-randomize-birthday"
                    >
                      Randomize birthday
                    </button>
                  </div>
                </div>
              </div>
            </section>
          </div>
          <div class="mx3col">
            <section id="cr-place-sec" class="sec strips dp2">
              <h3 class="sechead">Where I'm from</h3>
              <div class="secbody">
                <div id="cr-place" data-testid="creator-stage-place">
                  <p
                    id="cr-place-summary-name"
                    class="summary-name"
                    data-testid="creator-summary-place"
                  ></p>
                  <div id="cr-state-pick">
                    <label class="field" for="cr-state-search"
                      >Choose a state</label
                    >
                    <input
                      id="cr-state-search"
                      type="search"
                      autocomplete="off"
                      data-testid="state-search"
                    />
                    <div
                      id="cr-states"
                      class="choice-list"
                      data-testid="state-choices"
                    ></div>
                  </div>
                  <div id="cr-town-pick" hidden>
                    <button
                      id="cr-state"
                      class="summary"
                      type="button"
                      data-testid="creator-change-state"
                    >
                      <span id="cr-state-name" class="summary-value"></span
                      ><span class="summary-edit">Change</span>
                    </button>
                    <label class="field" for="cr-town-search">Search</label>
                    <input
                      id="cr-town-search"
                      type="search"
                      autocomplete="off"
                      data-testid="place-search"
                    />
                    <div
                      id="cr-towns"
                      class="choice-list"
                      data-testid="place-choices"
                    ></div>
                  </div>
                  <div class="acts">
                    <button
                      id="cr-place-random"
                      class="action small"
                      type="button"
                      data-testid="creator-random-place"
                      data-label="creator.randomPlace"
                    ></button>
                  </div>
                </div>
              </div>
            </section>
            <section class="sec strips dp3">
              <h3 class="sechead">How I look</h3>
              <div class="secbody">
                <div id="cr-look" data-testid="creator-stage-appearance">
                  <div
                    id="cr-rows"
                    data-testid="engine-appearance-controls"
                  ></div>
                  <div class="acts">
                    <button
                      id="cr-reset"
                      class="action small"
                      type="button"
                      data-testid="creator-reset-appearance"
                    >
                      Reset appearance
                    </button>
                    <button
                      id="cr-undo"
                      class="action small"
                      type="button"
                      data-testid="creator-undo-appearance"
                    >
                      Undo
                    </button>
                  </div>
                </div>
              </div>
            </section>
            <div class="acts">
              <button
                id="cr-begin"
                class="action primary small"
                type="button"
                data-testid="begin"
              >
                Begin my life
              </button>
            </div>
          </div>
        </div>
        <div class="progress" hidden><span></span></div>
        <p
          id="front-status"
          class="when"
          role="status"
          data-testid="loading-line"
        ></p>
      </section>

      <!-- Loading worth watching: the built world's past (playLoadingStory). -->
      <section
        id="loading-story"
        class="panel"
        data-testid="loading-story"
        hidden
      >
        <div id="loading-year" class="loading-year"></div>
        <div class="loading-body">
          <div
            id="loading-journal"
            class="loading-journal"
            aria-live="polite"
          ></div>
        </div>
      </section>

      <section id="sheet" class="panel" data-testid="sheet" hidden>
        <span
          data-panel-head
          data-title-id="sheet-title"
          data-close-id="sheet-close"
          data-testid="sheet-close"
        ></span>
        <div id="sheet-tabs"></div>
        <div id="sheet-body"></div>
      </section>

      <section id="talk" class="panel chat" hidden>
        <div id="talk-strip"></div>
        <button id="talk-lie" class="lie-scales" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M12 4.2v14.8M8 19h8" />
            <circle cx="12" cy="4.6" r=".9" />
            <path class="beam" d="M4.6 6.8h14.8" />
            <g class="pan pan-left">
              <path d="M4.6 6.8l-2.3 5.1h4.6z" />
              <path d="M2.3 11.9c.6 1.2 1.3 1.8 2.3 1.8s1.7-.6 2.3-1.8" />
            </g>
            <g class="pan pan-right">
              <path d="M19.4 6.8l-2.3 5.1h4.6z" />
              <path d="M17.1 11.9c.6 1.2 1.3 1.8 2.3 1.8s1.7-.6 2.3-1.8" />
            </g>
          </svg>
        </button>
        <div data-speaker="talk" data-role="none"></div>
        <ol id="talk-lines" class="talk-lines"></ol>
        <div id="talk-choices" class="replies"></div>
        <div class="acts">
          <button
            id="talk-next"
            class="action primary"
            type="button"
            data-label="talkBox.continue"
          ></button>
          <button
            id="talk-skip"
            class="action small"
            type="button"
            data-label="talkBox.skipScene"
            hidden
          ></button>
          <button id="talk-silent" class="action small" type="button">
            Say nothing
          </button>
          <button id="talk-leave" class="action" type="button">Leave</button>
        </div>
      </section>

      <section
        id="person"
        class="panel dossier"
        role="dialog"
        aria-labelledby="person-name"
        hidden
      >
        <div class="dossier-main">
          <span
            data-panel-head
            data-title-id="person-name"
            data-close-id="person-close"
          ></span>
          <div id="person-facts"></div>
        </div>
      </section>

      <section id="journal-note" class="panel journal toast" hidden>
        <div>
          <p class="label">Journal</p>
          <p id="journal-line" class="prose"></p>
        </div>
        <span data-close="journal-note-close"></span>
      </section>

      <!-- The menu icons stand on the card: one column, so the card never grows into them. -->
      <div id="dock">
        <nav id="rings" hidden></nav>
        <section id="card" class="panel me" hidden>
          <div class="card-id">
            <h2 id="card-name" class="name"></h2>
            <p id="card-place" class="role"></p>
          </div>
          <p id="card-clock" class="when"></p>
          <div class="time">
            <div class="acts">
              <button id="hour" class="action primary" type="button"></button>
              <button id="day" class="action primary" type="button"></button>
              <button id="week" class="action primary" type="button"></button>
              <button
                id="continue"
                class="action primary"
                type="button"
                hidden
              ></button>
            </div>
          </div>
        </section>
      </div>

      <aside id="tip" class="panel" hidden>
        <p id="tip-term" class="label"></p>
        <p id="tip-short" class="prose"></p>
        <button id="tip-learned" class="action" type="button">
          Mark as learned
        </button>
      </aside>
    </main>
    <script type="module" src="play.mjs"></script>
  </body>
</html>
