<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Our Civic Duty</title>
    <link rel="stylesheet" href="play.css" />
    <link rel="preload" as="image" href="/ui/kit13/progress-frame.svg" />
  </head>
  <body>
    <main id="game">
      <div id="stage">
        <img id="backdrop" alt="" />
        <div id="people"></div>
      </div>

      <!-- The opening: the President's speech box, then the night's news at home. -->
      <section id="opening-box" class="panel chat" hidden>
        <div class="who">
          <div id="opening-bust" class="bust"></div>
          <div>
            <div id="opening-name" class="name"></div>
            <div id="opening-role" class="role"></div>
          </div>
        </div>
        <p id="opening-speech" class="speech"></p>
      </section>
      <!-- Who the camera passes, pointed out by name and office. -->
      <div id="opening-point" class="panel" hidden>
        <div id="opening-point-name" class="name"></div>
        <div id="opening-point-role" class="role"></div>
      </div>
      <button id="news-surface" class="panel" type="button" hidden>
        <span id="news-surface-label" class="label"></span>
        <span id="news-surface-headline" class="prose"></span>
      </button>
      <!-- Election day at the polls: the ballot, from the elections engine's records. -->
      <section id="ballot" class="panel" hidden>
        <div id="ballot-races"></div>
        <div id="ballot-pager" class="acts" data-pager hidden></div>
        <div class="acts">
          <button id="ballot-leave" class="action" type="button"></button>
        </div>
      </section>
      <section id="meeting" class="panel" hidden>
        <div id="meeting-items"></div>
        <div class="acts">
          <button id="meeting-adjourn" class="action" type="button"></button>
        </div>
      </section>
      <section id="desk" class="panel" hidden>
        <div id="desk-items"></div>
      </section>
      <section id="job-offer" class="panel" data-testid="job-offer" hidden>
        <h2 id="job-offer-title" class="heading"></h2>
        <p id="job-offer-employer"></p>
        <div id="job-offer-facts"></div>
        <div class="acts">
          <button
            id="job-offer-take"
            class="action primary"
            type="button"
          ></button>
          <button id="job-offer-turn" class="action" type="button"></button>
          <button
            id="job-offer-wait"
            class="action small"
            type="button"
            hidden
          ></button>
        </div>
        <p id="job-offer-status" role="status"></p>
      </section>
      <section id="news-reader" class="panel" hidden>
        <div class="news-reader-main">
          <h2 id="news-reader-headline" class="heading"></h2>
          <div id="news-reader-body"></div>
          <div id="news-reader-pager" class="acts" data-pager hidden></div>
        </div>
        <div>
          <div class="acts">
            <span data-close="news-reader-close"></span>
          </div>
          <div id="news-reader-more"></div>
        </div>
      </section>

      <section id="front" class="panel menu" data-testid="title-menu">
        <h1 class="title">Our Civic Duty</h1>
        <!-- The title menu as the Oct 12 title had it (TitleScreen.tsx, 29be9982f5^). -->
        <div id="front-main">
          <button
            id="new-life"
            class="item"
            type="button"
            data-testid="new-game"
          >
            <b>New game</b>
          </button>
          <button
            id="front-watch"
            class="item"
            type="button"
            data-testid="watch-world"
            disabled
          >
            <b>Watch the world</b>
          </button>
          <button
            id="front-continue"
            class="item"
            type="button"
            data-testid="continue"
            disabled
          >
            <b>Continue</b><small id="front-continue-life"></small>
          </button>
          <button
            id="front-saves"
            class="item"
            type="button"
            data-testid="open-saves"
            disabled
          >
            <b>Saved games</b>
          </button>
          <button
            id="front-options"
            class="item"
            type="button"
            data-testid="title-options"
          >
            <b>Options</b>
          </button>
          <button
            id="front-patch-notes"
            class="item"
            type="button"
            data-testid="title-patch-notes"
            disabled
          >
            <b>Patch notes</b>
          </button>
          <!-- Quit is the desktop's; a browser tab has none to offer. -->
          <button
            id="front-quit"
            class="item"
            type="button"
            data-testid="quit"
            hidden
          >
            <b>Quit</b>
          </button>
          <small
            id="title-version"
            class="title-version"
            data-testid="title-version"
          ></small>
        </div>
        <!-- New game: how the world begins. -->
        <div id="front-new" data-testid="new-game-choice" hidden>
          <button
            id="new-custom"
            class="item"
            type="button"
            data-testid="custom-world"
          >
            <b>Custom world</b>
          </button>
          <button
            id="new-start"
            class="item"
            type="button"
            data-testid="start-life"
          >
            <b>Start a life</b>
          </button>
          <button
            id="new-world"
            class="item"
            type="button"
            data-testid="new-world"
          >
            <b>New world</b>
          </button>
          <button
            id="new-back"
            class="item"
            type="button"
            data-testid="new-game-back"
          >
            <b>Back</b>
          </button>
        </div>
        <!-- Custom world: the Oct 13 front's settings. -->
        <div id="front-custom" data-testid="custom-world-panel" hidden>
          <div class="field">
            <label for="seed">Seed</label>
            <span class="seed-row"
              ><input id="seed" /><button
                id="seed-random"
                class="action small"
                type="button"
                data-testid="seed-random"
              >
                Random
              </button></span
            >
          </div>
          <label class="field"
            >Opening date <input id="date" type="date" readonly
          /></label>
          <label class="field"
            >Town size
            <input
              id="set-population"
              type="number"
              min="100"
              max="50000"
              step="100"
              placeholder="Real"
          /></label>
          <label class="field"
            >Wages ×
            <input
              id="set-wages"
              type="number"
              min="0.25"
              max="4"
              step="0.05"
              placeholder="1"
          /></label>
          <label class="field"
            >Household cash ×
            <input
              id="set-cash"
              type="number"
              min="0.25"
              max="4"
              step="0.05"
              placeholder="1"
          /></label>
          <label class="field"
            >Outside demand ×
            <input
              id="set-demand"
              type="number"
              min="0.25"
              max="4"
              step="0.05"
              placeholder="1"
          /></label>
          <label class="field"
            >Lean (−1 left, +1 right)
            <input
              id="set-lean"
              type="number"
              min="-1"
              max="1"
              step="0.05"
              placeholder="0"
          /></label>
          <label class="field"
            >Turnout ×
            <input
              id="set-turnout"
              type="number"
              min="0.25"
              max="4"
              step="0.05"
              placeholder="1"
          /></label>

          <div class="acts">
            <button id="custom-back" class="action small" type="button">
              Back
            </button>
            <button
              id="custom-next"
              class="action primary small"
              type="button"
              data-testid="custom-continue"
            >
              Continue
            </button>
          </div>
        </div>
        <!-- The creator, step by step as the Oct 12 SetupScreen had it. -->
        <div id="cr-character" data-testid="creator-stage-character" hidden>
          <button
            id="cr-route"
            class="summary"
            type="button"
            data-testid="creator-summary-route"
          >
            <span id="cr-route-name" class="summary-value"></span
            ><span class="summary-edit">Change</span>
          </button>
          <h2 class="label">Your character</h2>
          <fieldset class="group" data-testid="gender-choices">
            <legend class="label">Gender (required)</legend>
            <div class="choices">
              <button
                type="button"
                class="action small"
                data-gender="female"
                data-testid="gender-female"
              >
                Female
              </button>
              <button
                type="button"
                class="action small"
                data-gender="male"
                data-testid="gender-male"
              >
                Male
              </button>
              <button
                type="button"
                class="action small"
                data-gender="nonbinary"
                data-testid="gender-nonbinary"
              >
                Non-binary
              </button>
            </div>
          </fieldset>
          <div class="group">
            <span class="label">Name</span>
            <label class="field"
              >First name
              <input id="cr-given" maxlength="40" autocomplete="off"
            /></label>
            <label class="field"
              >Last name
              <input id="cr-family" maxlength="40" autocomplete="off"
            /></label>
            <button
              id="cr-random-name"
              class="action small"
              type="button"
              data-testid="creator-randomize-name"
            >
              Randomize name
            </button>
          </div>
          <fieldset class="group" data-testid="creator-birthday">
            <legend class="label">Birthday</legend>
            <div class="date-row">
              <label class="field"
                >Month
                <select id="cr-month" data-testid="start-birth-month"></select
              ></label>
              <label class="field"
                >Day
                <select id="cr-day" data-testid="start-birth-day"></select
              ></label>
              <label class="field"
                >Year
                <select id="cr-year" data-testid="start-birth-year"></select
              ></label>
            </div>
            <button
              id="cr-random-birthday"
              class="action small"
              type="button"
              data-testid="creator-randomize-birthday"
            >
              Randomize birthday
            </button>
            <p
              id="cr-derived-age"
              class="when"
              data-testid="creator-derived-age"
            ></p>
          </fieldset>
          <div class="acts">
            <button id="cr-character-back" class="action small" type="button">
              Back
            </button>
            <button
              id="cr-character-next"
              class="action primary small"
              type="button"
              data-testid="creator-continue-character"
            >
              Continue
            </button>
          </div>
        </div>
        <div id="cr-place" data-testid="creator-stage-place" hidden>
          <button
            id="cr-summary"
            class="summary"
            type="button"
            data-testid="creator-summary-character"
          >
            <span class="summary-value"
              ><strong id="cr-summary-name" class="summary-name"></strong
              ><span id="cr-summary-age"></span
              ><span id="cr-summary-born"></span></span
            ><span class="summary-edit">Change</span>
          </button>
          <h2 class="label">Where are you from?</h2>
          <div id="cr-state-pick">
            <label class="field" for="cr-state-search">Choose a state</label>
            <input
              id="cr-state-search"
              type="search"
              autocomplete="off"
              data-testid="state-search"
            />
            <div
              id="cr-states"
              class="choice-list"
              data-testid="state-choices"
            ></div>
          </div>
          <div id="cr-town-pick" hidden>
            <button
              id="cr-state"
              class="summary"
              type="button"
              data-testid="creator-change-state"
            >
              <span id="cr-state-name" class="summary-value"></span
              ><span class="summary-edit">Change</span>
            </button>
            <label class="field" for="cr-town-search">Search</label>
            <input
              id="cr-town-search"
              type="search"
              autocomplete="off"
              data-testid="place-search"
            />
            <div
              id="cr-towns"
              class="choice-list"
              data-testid="place-choices"
            ></div>
          </div>
          <div class="acts">
            <button id="cr-place-back" class="action small" type="button">
              Back
            </button>
          </div>
        </div>
        <div id="cr-look" data-testid="creator-stage-appearance" hidden>
          <img
            id="cr-portrait"
            class="portrait"
            alt=""
            data-testid="creator-engine-figure"
          />
          <h2 class="label">Character appearance</h2>
          <div id="cr-rows" data-testid="engine-appearance-controls"></div>
          <button id="cr-randomize" class="action small" type="button">
            Randomize
          </button>
          <div class="acts">
            <button
              id="cr-reset"
              class="action small"
              type="button"
              data-testid="creator-reset-appearance"
            >
              Reset appearance
            </button>
            <button
              id="cr-undo"
              class="action small"
              type="button"
              data-testid="creator-undo-appearance"
            >
              Undo
            </button>
          </div>
          <div class="acts">
            <button id="cr-look-back" class="action small" type="button">
              Back
            </button>
            <button
              id="cr-begin"
              class="action primary small"
              type="button"
              data-testid="begin"
            >
              Begin
            </button>
          </div>
        </div>
        <div class="progress" hidden><span></span></div>
        <p
          id="front-status"
          class="when"
          role="status"
          data-testid="loading-line"
        ></p>
      </section>

      <nav id="menu" class="panel" hidden>
        <h2 class="menu-title">Menu</h2>
        <span data-menu-items></span>
        <button
          id="dev-mode"
          type="button"
          class="nav-item dev-only"
          onclick="window.open('/dev')"
        >
          <span class="nl">Dev mode</span>
        </button>
      </nav>

      <section id="sheet" class="panel" data-testid="sheet" hidden>
        <header class="sheet-head">
          <h2 id="sheet-title" class="heading"></h2>
          <div class="acts">
            <span data-close="sheet-close" data-testid="sheet-close"></span>
          </div>
        </header>
        <nav id="sheet-tabs" class="tabs"></nav>
        <div id="sheet-media" hidden></div>
        <div id="sheet-body"></div>
        <div id="sheet-pager" class="acts" data-pager hidden></div>
      </section>

      <section id="talk" class="panel chat" hidden>
        <button id="talk-lie" class="lie-scales" type="button">
          <svg class="level" viewBox="0 0 24 24">
            <path d="M12 4.2v14.8M8 19h8M4.6 6.8h14.8" />
            <circle cx="12" cy="4.6" r=".9" />
            <path d="M4.6 6.8l-2.3 5.1h4.6zM19.4 6.8l-2.3 5.1h4.6z" />
            <path
              d="M2.3 11.9c.6 1.2 1.3 1.8 2.3 1.8s1.7-.6 2.3-1.8M17.1 11.9c.6 1.2 1.3 1.8 2.3 1.8s1.7-.6 2.3-1.8"
            />
          </svg>
          <svg class="tipped" viewBox="0 0 24 24">
            <path d="M12 4.2v14.8M8 19h8M4.9 8.7l14.2-4.2" />
            <circle cx="12" cy="4.6" r=".9" />
            <path d="M4.9 8.7l-2.3 5.1h4.6zM19.1 4.5l-2.3 5.1h4.6z" />
            <path
              d="M2.6 13.8c.6 1.2 1.3 1.8 2.3 1.8s1.7-.6 2.3-1.8M16.8 9.6c.6 1.2 1.3 1.8 2.3 1.8s1.7-.6 2.3-1.8"
            />
          </svg>
        </button>
        <div id="talk-who" class="who">
          <div id="talk-bust" class="bust"></div>
          <div>
            <div id="talk-name" class="name"></div>
            <div id="talk-role" class="role"></div>
          </div>
        </div>
        <ol id="talk-lines"></ol>
        <div id="talk-choices" class="replies"></div>
        <div class="acts">
          <button id="talk-silent" class="action small" type="button">
            Say nothing
          </button>
          <button id="talk-leave" class="action" type="button">Leave</button>
        </div>
      </section>

      <section id="filing-overlay" class="panel" hidden>
        <h2 id="filing-title" class="name"></h2>
        <div id="filing-checks"></div>
        <div id="filing-platform"></div>
        <label class="row"
          ><b>Party</b>
          <select id="filing-party"></select
        ></label>
      </section>

      <section
        id="person"
        class="panel dossier"
        role="dialog"
        aria-labelledby="person-name"
        hidden
      >
        <div class="dossier-media">
          <img id="person-background" alt="" hidden />
          <img id="person-figure" alt="" hidden />
        </div>
        <div class="dossier-main">
          <h2 id="person-name" class="heading"></h2>
          <p id="person-role" class="role"></p>
          <div id="person-facts"></div>
          <div id="person-pager" class="acts" data-pager="person" hidden></div>
          <div class="acts">
            <button
              id="person-talk"
              class="action primary"
              type="button"
            ></button>
            <span data-close="person-close"></span>
          </div>
        </div>
      </section>

      <section id="journal-note" class="panel journal" hidden>
        <p class="label">Journal</p>
        <p id="journal-line" class="prose"></p>
      </section>

      <!-- The menu icons stand on the card: one column, so the card never grows into them. -->
      <div id="dock">
        <nav id="rings" hidden></nav>
        <section id="card" class="panel me" hidden>
          <div id="card-bust" class="bust"></div>
          <div>
            <h2 id="card-name" class="name"></h2>
            <p id="card-place" class="role"></p>
            <p id="card-clock" class="when"></p>
          </div>
          <div class="time">
            <p id="card-why" class="label"></p>
            <div class="acts">
              <button id="day" class="action primary" type="button">Day</button>
              <button id="week" class="action primary" type="button"></button>
              <button id="continue" class="action primary" type="button" hidden>
                Continue
              </button>
            </div>
          </div>
        </section>
      </div>

      <aside id="tip" class="panel" hidden>
        <p id="tip-term" class="label"></p>
        <p id="tip-short" class="prose"></p>
        <button id="tip-learned" class="action" type="button">
          Mark as learned
        </button>
      </aside>

      <button
        id="dev-toggle"
        class="ring dev-ring"
        type="button"
        aria-label="Customize the world"
      >
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"
          />
        </svg>
      </button>
    </main>
    <script type="module" src="play.mjs"></script>
  </body>
</html>
