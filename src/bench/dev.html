<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dev mode</title>
    <link rel="stylesheet" href="/kit12.css" />
    <style>
      /* Kit 12 tokens and classes (kit12.css); only the page's layout lives here. */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(ellipse at top, #2c2a27 0%, var(--iron) 60%)
          fixed;
        background-color: var(--iron);
        color: var(--text);
        font: 400 14px/1.4 var(--ui);
      }
      header.panel {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 22px;
        align-items: baseline;
        padding: 10px 16px;
        margin: 0 0 12px;
      }
      header .name {
        font-size: 20px;
        color: var(--gold);
      }
      .when b {
        color: var(--text-strong);
        font-weight: 500;
      }
      nav.tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        padding: 0 16px 10px;
      }
      .tab {
        font: 600 12px var(--ui);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-2);
        background: none;
        border: 0;
        padding: 4px 0;
        cursor: pointer;
      }
      .tab.on {
        color: var(--text);
        border-bottom: 1.5px solid var(--red);
      }
      main {
        padding: 0 16px 40px;
      }
      section.panel {
        padding: 14px 16px;
        margin-bottom: 14px;
      }
      section[hidden] {
        display: none;
      }
      button.action {
        background: none;
        border: 0;
        padding: 3px 0;
        cursor: pointer;
      }
      button.action:disabled {
        color: var(--text-3);
        cursor: default;
      }
      input,
      select {
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(156, 131, 80, 0.55);
        border-radius: 2px;
        color: var(--text);
        font: 400 13px var(--ui);
        padding: 4px 6px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        margin: 6px 0;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) minmax(300px, 1.3fr);
        gap: 14px;
      }
      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .scroll {
        max-height: 62vh;
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-variant-numeric: tabular-nums;
      }
      th {
        text-align: left;
        font: 600 10.5px var(--ui);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--gold);
        padding: 4px 8px 4px 0;
        position: sticky;
        top: 0;
        background: #1f1e1c;
      }
      td {
        padding: 3px 8px 3px 0;
        border-top: 1px solid rgba(156, 131, 80, 0.18);
        vertical-align: top;
      }
      tr.item {
        cursor: pointer;
      }
      tr.item:hover td,
      tr.item.on td {
        color: #fff;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.45);
      }
      .dev {
        color: #ffc9bd;
      }
      .after td {
        border-top-color: rgba(185, 88, 74, 0.55);
      }
      .id {
        color: var(--gold);
        cursor: pointer;
        text-decoration: underline dotted rgba(214, 189, 132, 0.6);
      }
      details {
        margin: 2px 0 2px 12px;
      }
      summary {
        cursor: pointer;
        color: var(--text-2);
      }
      .kv {
        margin-left: 12px;
        word-break: break-word;
      }
      .kv > span:first-child {
        color: var(--text-3);
      }
      .node {
        margin: 4px 0 4px 14px;
        border-left: 1px solid rgba(156, 131, 80, 0.35);
        padding-left: 10px;
      }
      .node .via {
        color: var(--text-3);
        margin-right: 8px;
      }
      .node .kind {
        font: 600 10.5px var(--ui);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gold);
        margin-right: 8px;
      }
      .node.learned > .head .kind {
        color: #b9c2c9;
      }
      .node.on > .head .id {
        color: #fff;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
      }
      .error {
        color: #ffc9bd;
      }
      svg.chart {
        width: 100%;
        height: 160px;
      }
      svg.chart .public {
        stroke: var(--gold);
      }
      svg.chart .private {
        stroke: #b9c2c9;
      }
      svg.chart .mark {
        stroke: var(--red);
        stroke-dasharray: 3 3;
      }
      svg.chart path,
      svg.chart line {
        fill: none;
        stroke-width: 1.5;
      }
      svg.chart text {
        fill: var(--text-3);
        font: 400 10px var(--ui);
      }
    </style>
  </head>
  <body>
    <header class="panel">
      <span class="name">Dev mode</span>
      <span class="when"
        >Place <b id="place"></b> · Seed <b id="seed"></b> · Date
        <b id="date"></b> · Journal checks <b id="journal-checks"></b
      ></span>
      <span class="row">
        <input id="new-seed" placeholder="Seed" size="14" />
        <button id="build" class="action" type="button">New world</button>
        <a class="action" href="/play">Play</a>
      </span>
      <span class="row" id="time">
        <span class="label">Time</span>
        <button class="action" type="button" data-step="day">Day</button>
        <button class="action" type="button" data-step="week">Week</button>
        <button class="action" type="button" data-step="month">Month</button>
        <button class="action" type="button" data-step="year">Year</button>
        <input id="to-date" type="date" />
        <button class="action" type="button" data-step="date">To date</button>
        <span id="time-result" class="when"></span>
      </span>
      <span id="error" class="error"></span>
    </header>
    <nav class="tabs">
      <button class="tab on" type="button" data-tab="laws">Laws</button>
      <button class="tab" type="button" data-tab="decisions">Decisions</button>
      <button class="tab" type="button" data-tab="trace">Trace</button>
      <button class="tab" type="button" data-tab="watch">Watch</button>
      <button class="tab" type="button" data-tab="experiments">
        Experiments
      </button>
    </nav>
    <main>
      <section id="laws" class="panel">
        <div class="row">
          <span class="label">Laws</span>
          <input id="law-filter" placeholder="Series" size="30" />
        </div>
        <div class="grid">
          <div class="scroll"><table id="law-table"></table></div>
          <div>
            <div class="label" id="law-series"></div>
            <div class="row">
              <select id="law-level"></select>
              <input id="law-value" placeholder="Value" size="10" />
              <input id="law-unit" placeholder="Unit" size="12" />
              <input id="law-date" type="date" />
            </div>
            <div class="row">
              <button id="law-set" class="action primary" type="button">
                Set
              </button>
              <button id="law-repeal" class="action" type="button">
                Repeal
              </button>
            </div>
            <div id="law-result"></div>
          </div>
        </div>
      </section>

      <section id="decisions" class="panel" hidden>
        <div class="grid">
          <div>
            <div class="row">
              <span class="label">People</span>
              <input id="person-filter" placeholder="Name or id" size="24" />
            </div>
            <div class="scroll"><table id="people-table"></table></div>
          </div>
          <div>
            <div class="label" id="offers-name"></div>
            <div class="scroll"><table id="offers-table"></table></div>
            <div id="choose-result"></div>
          </div>
        </div>
        <div class="row"><span class="label">Bodies</span></div>
        <div id="bodies"></div>
      </section>

      <section id="trace" class="panel" hidden>
        <div class="row">
          <span class="label">Record</span>
          <input id="trace-id" placeholder="Record id" size="48" />
          <button id="trace-go" class="action primary" type="button">
            Trace
          </button>
          <button id="person-go" class="action" type="button">Person</button>
          <button id="trace-report" class="action" type="button">Report</button>
        </div>
        <div id="trace-chain" class="when"></div>
        <div id="trace-result"></div>
      </section>

      <section id="watch" class="panel" hidden>
        <div class="row">
          <span class="label">Pay by month</span>
          <span class="when"
            ><span style="color: var(--gold)">Public</span> ·
            <span style="color: #b9c2c9">Private</span></span
          >
        </div>
        <div id="chart"></div>
        <div class="scroll"><table id="watch-table"></table></div>
        <div class="row"><span class="label">Town measures</span></div>
        <div class="scroll"><table id="metrics-table"></table></div>
        <div class="row"><span class="label">Nation</span></div>
        <div class="scroll"><table id="nation-table"></table></div>
        <div class="row"><span class="label">Budgets</span></div>
        <div id="budgets"></div>
        <div class="row"><span class="label">Prices</span></div>
        <div id="prices"></div>
        <div class="row"><span class="label">News</span></div>
        <div class="scroll"><table id="news-table"></table></div>
      </section>

      <section id="experiments" class="panel" hidden>
        <div class="scroll"><table id="experiment-table"></table></div>
        <div class="row">
          <input id="save-id" placeholder="Experiment id" size="28" />
          <input id="save-months" type="number" value="12" min="1" />
          <button id="save" class="action" type="button">
            Save this session's changes
          </button>
        </div>
        <div id="experiment-result"></div>
      </section>
    </main>
    <script type="module" src="/dev.mjs"></script>
  </body>
</html>
