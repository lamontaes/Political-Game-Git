<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Government · Our Civic Duty</title>
<link rel="stylesheet" href="../style.css">
<style>
body {background-image:url(../art/council-chamber-small__midday.jpg)}
.heading {display:flex;align-items:center;gap:20px;margin-top:15px}
.heading img {width:84px;height:84px}
.heading .label {margin-bottom:5px}
.filters {margin-bottom:3px}
.filters + .filters {margin-top:6px}
.filters button {padding-block:5px}
.roster {margin-top:23px}
.members {display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-top:4px}
.member {display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:3px 6px 10px;text-align:center;white-space:normal;min-height:242px}
.member .portrait {height:168px;margin-bottom:5px}
.member strong {display:block;font-size:19px}
.member small {display:block}
.member .note {font-size:15px;color:var(--gold)}
.record {display:grid;grid-template-columns:1.85fr .85fr 1fr;gap:36px;margin-top:20px}
.record .label {margin-bottom:11px}
.vote {display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:10px}
.vote p {font-size:17px}
.result {text-align:right;color:#e5d6ac;white-space:nowrap}
.mayor {display:flex;align-items:center;gap:9px}
.mayor .portrait {width:78px;height:90px;flex:none}
</style>
<body>
<main class="panel menu">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner br"></i><i class="corner bl"></i>
  <header class="top">
    <span class="plate">Politics</span>
    <nav aria-label="Politics">
      <button class="control lit" aria-current="page">Government</button><button class="control">Elections</button><button class="control">Parties</button><button class="control">Issues</button><button class="control">Bills</button><button class="control">Budgets</button><button class="control">Metrics</button>
    </nav>
    <span class="date muted">Monday, January 20, 2025</span>
  </header>
  <div class="filters" aria-label="Government level and branch">
    <button class="control lit">Local</button><button class="control">State</button><button class="control">Federal</button>
    <span style="width:22px"></span>
    <button class="control lit">Legislative</button><button class="control">Executive</button>
  </div>
  <div class="filters" aria-label="Governing bodies">
    <button class="control lit">Grano City Council</button><button class="control">Renville County Board of Commissioners</button>
  </div>
  <div class="heading">
    <img src="../art/signet.svg" alt="">
    <div><span class="label">5 seats · Nonpartisan</span><h1>Grano City Council</h1></div>
  </div>
  <section class="roster">
    <span class="label">Council members</span>
    <div class="members">
      <button class="control member" aria-pressed="false"><span class="portrait"><img src="../art/alexis.webp" alt=""></span><strong>Alexis Harrison</strong><small>At large</small></button>
      <button class="control member" aria-pressed="false"><span class="portrait"><img src="../art/allen.webp" alt=""></span><strong>Allen Schultz</strong><small>At large</small><small class="note">Named mayor pro tem this week</small></button>
      <button class="control member" aria-pressed="false"><span class="portrait"><img src="../art/charlotte.webp" alt=""></span><strong>Charlotte Schultz</strong><small>At large</small></button>
      <button class="control member" aria-pressed="false"><span class="portrait"><img src="../art/shane.webp" alt=""></span><strong>Shane Harrison</strong><small>At large</small></button>
      <button class="control member" aria-pressed="false"><span class="portrait"><img src="../art/shirley.webp" alt=""></span><strong>Shirley Pratt</strong><small>At large</small></button>
    </div>
  </section>
  <div class="record">
    <section><span class="label">Recent votes</span>
      <div class="vote"><div><p>Fund pensions to schedule</p><small>Jan 18, 2024</small></div><span class="result">Passed · 3 yes, 0 no</span></div>
      <div class="vote"><div><p>Raise minimum wage</p><small>Jul 13, 2023</small></div><span class="result">Passed · 3 yes, 0 no</span></div>
    </section>
    <section><span class="label">Coming up</span><h2>Regular meeting</h2><p class="muted">Feb 4</p></section>
    <section><span class="label">Mayor</span><div class="mayor"><span class="portrait"><img src="../art/chris.webp" alt=""></span><div><h2>Chris Munoz</h2><small>Since June 2022</small></div></div></section>
  </div>
</main>
<script>
  const members = document.querySelector('.members');
  members.addEventListener('click', (event) => {
    const selected = event.target.closest('.member');
    if (!selected) return;
    selected.classList.add('lit');
    selected.setAttribute('aria-pressed', 'true');
  }, { once: true });
</script>
</body>
</html>
