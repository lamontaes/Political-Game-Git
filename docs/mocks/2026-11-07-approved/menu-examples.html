<meta charset="utf-8" />
<title>Menu Examples</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Fira+Sans:wght@400;500;600;700&family=Andada+Pro:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Old+Standard+TT:wght@400;700&family=Libre+Franklin:wght@600;700&family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Libre+Caslon+Display&display=swap"
/>
<style>
  /* Layout: the real 1440x900 game screen, scaled to fit, under a control strip. One dark look, the game's own. */
  :root {
    color-scheme: dark;
    --page: #0f0e0c;
    --strip: #1a1815;
    --ink: #f4efe5;
    --muted: #c4bbab;
    --dim: #9a9283;
    --gold: #dcc48c;
    --gold2: #e6cd93;
    --brass: #9c8350;
    --lit1: #7a6338;
    --lit2: #4a3b22;
    --glow: rgba(232, 196, 120, 0.3);
    --line: rgba(242, 210, 140, 0.9);
    --f-title: "Cinzel", Georgia, serif;
    --f-ui: "Fira Sans", system-ui, sans-serif;
    --f-story: "Andada Pro", Georgia, serif;
    --yes: #4d6e3f;
    --no: #8a3530;
    --dem: #3f5f8f;
    --rep: #8a3530;
    --ind: #6e665a;
    --bar-ink: #fff;
  }
  .cb {
    --yes: #c9a85a;
    --no: #7d8794;
    --dem: #5896dc;
    --rep: #de6c58;
    --ind: #b9b0a2;
    --bar-ink: #14161a;
  }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--f-ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px 24px;
  }
  .wrap {
    max-width: 1440px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .strip {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    align-items: center;
    background: var(--strip);
    border-radius: 3px;
    padding: 10px 14px;
    box-shadow: inset 0 0 0 1px rgba(156, 131, 80, 0.3);
  }
  .strip h1 {
    font: 800 17px var(--f-title);
    color: #f2e6c9;
    margin: 0;
    flex: 1 1 200px;
    letter-spacing: 0.3px;
  }
  .group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .group > span {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .seg {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 2px;
    padding: 3px;
    background: rgba(6, 6, 7, 0.62);
    border-radius: 2px;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.55);
  }
  .seg button,
  .sbtn {
    font: 500 14px var(--f-ui);
    color: #ddd6c8;
    background: none;
    border: 0;
    padding: 6px 11px;
    border-radius: 2px;
    cursor: pointer;
  }
  .sbtn {
    background: linear-gradient(#3b3934, #22201d);
    box-shadow:
      inset 0 1px 0 rgba(255, 236, 190, 0.16),
      0 2px 5px rgba(0, 0, 0, 0.5);
  }
  .sbtn:hover {
    box-shadow:
      0 0 14px var(--glow),
      inset 0 1px 0 rgba(255, 236, 190, 0.2);
  }
  .seg button[aria-pressed="true"] {
    background: linear-gradient(var(--lit1), var(--lit2));
    color: #fff3d6;
    box-shadow:
      inset 0 1px 0 rgba(255, 236, 190, 0.35),
      0 0 10px rgba(232, 196, 120, 0.3);
  }
  button:focus-visible,
  .check input:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid #f3dba7;
    outline-offset: 2px;
  }
  .note {
    font-size: 14px;
    line-height: 1.55;
    color: var(--muted);
    margin: 0;
    max-width: 90ch;
  }
  .note b {
    color: var(--ink);
    font-weight: 500;
  }
  .viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 1440/900;
    max-width: 100%;
    overflow: hidden;
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(156, 131, 80, 0.3);
  }
  .stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1440px;
    height: 900px;
    transform-origin: 0 0;
    font-family: var(--f-ui);
    color: var(--ink);
    overflow: hidden;
  }
  .stage,
  .stage *,
  .stage *::before,
  .stage *::after {
    box-sizing: border-box;
  }
  .stage h2,
  .stage h3,
  .stage p,
  .stage ul {
    margin: 0;
    padding: 0;
  }
  .stage ul {
    list-style: none;
  }
  .stage button {
    font-family: inherit;
  }

  /* the room */
  .scene {
    position: absolute;
    inset: 0;
    background: center/cover;
    transition: filter 0.3s;
  }
  .menu-open .scene {
    filter: blur(2px) brightness(0.86);
  }

  /* the menu panel: dark textured glass, 78% solid, darker tint, slim brass edge */
  .frost {
    position: absolute;
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
  }
  .panel {
    position: absolute;
    display: flex;
    flex-direction: column;
    padding: 30px 42px 30px;
    background: url(img/panel.png) center/100% 100%;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
  }
  .panel::before {
    content: "";
    position: absolute;
    inset: 7px;
    background: rgba(14, 13, 11, 0.42);
    pointer-events: none;
  }
  .panel > * {
    position: relative;
  }
  .frost,
  .panel {
    left: 24px;
    top: 18px;
    width: 1392px;
  }
  .nav-row .frost,
  .nav-row .panel {
    height: 672px;
  }
  .nav-fan .frost,
  .nav-fan .panel {
    height: 734px;
  }
  .frost {
    left: 26px;
    top: 20px;
    width: 1388px;
  }
  .nav-row .frost {
    height: 668px;
  }
  .nav-fan .frost {
    height: 730px;
  }
  .phead {
    display: flex;
    align-items: center;
    gap: 26px;
    margin-bottom: 12px;
    min-height: 44px;
  }
  .ptitle {
    font: 800 27px var(--f-title);
    letter-spacing: 0.3px;
    color: #f2e6c9;
    white-space: nowrap;
  }
  .x {
    position: absolute;
    right: -6px;
    top: -4px;
    width: 40px;
    height: 40px;
    border: 0;
    background: none;
    color: #f2e6c9;
    cursor: pointer;
    border-radius: 50%;
    display: grid;
    place-items: center;
    transition:
      box-shadow 0.14s,
      color 0.14s;
  }
  .x svg {
    width: 20px;
    height: 20px;
  }
  .x:hover {
    color: #fff3d6;
    box-shadow:
      0 0 16px var(--glow),
      inset 0 0 12px rgba(232, 196, 120, 0.14);
  }
  .pbody {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* tab rails: recessed, soft light top and bottom, no box line */
  .tabrail {
    position: relative;
    display: inline-flex;
    flex-wrap: nowrap;
    gap: 2px;
    padding: 4px;
    background: linear-gradient(rgba(6, 6, 7, 0.66), rgba(10, 10, 10, 0.48));
    box-shadow: inset 0 2px 7px rgba(0, 0, 0, 0.62);
    border-radius: 2px;
    align-self: flex-start;
  }
  .tabrail::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(
          90deg,
          transparent,
          rgba(240, 206, 136, 0.34) 50%,
          transparent
        )
        top/100% 1px no-repeat,
      linear-gradient(
          90deg,
          transparent,
          rgba(240, 206, 136, 0.22) 50%,
          transparent
        )
        bottom/100% 1px no-repeat;
  }
  .tabrail button {
    position: relative;
    z-index: 1;
    border: 0;
    background: none;
    padding: 8px 16px;
    font-size: 15.5px;
    font-weight: 500;
    color: #ddd6c8;
    border-radius: 2px;
    white-space: nowrap;
    cursor: pointer;
    transition:
      color 0.14s,
      text-shadow 0.14s,
      background 0.14s;
  }
  .tabrail.small button {
    padding: 6px 13px;
    font-size: 14.5px;
  }
  .tabrail button:not(.on):hover {
    color: #f6dfae;
    text-shadow: 0 0 10px rgba(240, 206, 136, 0.55);
    background: rgba(255, 248, 230, 0.05);
  }
  .tabrail button.on {
    background: linear-gradient(var(--lit1), var(--lit2));
    color: #fff3d6;
    box-shadow:
      inset 0 1px 0 rgba(255, 236, 190, 0.35),
      0 0 14px rgba(232, 196, 120, 0.35);
  }
  .subs {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  /* buttons: glass at rest, fading frame and halo on hover, lit when pressed */
  .kbtn {
    position: relative;
    font: 500 15px var(--f-ui);
    color: #e9e2d4;
    padding: 9px 20px;
    border: 0;
    border-radius: 2px;
    background: linear-gradient(#3b3934, #22201d);
    box-shadow:
      inset 0 1px 0 rgba(255, 236, 190, 0.16),
      0 2px 5px rgba(0, 0, 0, 0.55);
    cursor: pointer;
    transition: box-shadow 0.14s;
    text-shadow: none;
  }
  .kbtn::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 2px;
    pointer-events: none;
    background:
      linear-gradient(
          90deg,
          transparent 6%,
          rgba(240, 206, 136, 0.42) 50%,
          transparent 94%
        )
        top/100% 1px no-repeat,
      linear-gradient(
          90deg,
          transparent 6%,
          rgba(240, 206, 136, 0.42) 50%,
          transparent 94%
        )
        bottom/100% 1px no-repeat;
  }
  .kbtn:hover {
    box-shadow:
      inset 0 1px 0 rgba(255, 236, 190, 0.2),
      0 0 16px 1px var(--glow),
      inset 0 0 14px rgba(232, 196, 120, 0.12),
      0 2px 5px rgba(0, 0, 0, 0.55);
  }
  .kbtn:hover::after {
    background:
      linear-gradient(90deg, transparent 4%, var(--line) 50%, transparent 96%)
        top/100% 1px no-repeat,
      linear-gradient(90deg, transparent 4%, var(--line) 50%, transparent 96%)
        bottom/100% 1px no-repeat,
      linear-gradient(
          180deg,
          transparent 10%,
          rgba(242, 210, 140, 0.6) 50%,
          transparent 90%
        )
        left/1px 100% no-repeat,
      linear-gradient(
          180deg,
          transparent 10%,
          rgba(242, 210, 140, 0.6) 50%,
          transparent 90%
        )
        right/1px 100% no-repeat;
  }
  .kbtn.on,
  .kbtn:active {
    background: linear-gradient(var(--lit1), var(--lit2));
    color: #fff3d6;
    box-shadow:
      inset 0 1px 0 rgba(255, 236, 190, 0.35),
      0 0 14px rgba(232, 196, 120, 0.35);
  }
  .kbtn.on::after {
    opacity: 0;
  }
  .kbtn[disabled] {
    opacity: 0.42;
    pointer-events: none;
  }
  .kbtn.big {
    font-size: 16px;
    padding: 11px 24px;
  }

  /* any clickable row: soft fill plus the fading frame with halo on hover, lit fill when selected */
  .pick {
    position: relative;
    border-radius: 3px;
    cursor: pointer;
    transition:
      background-color 80ms,
      box-shadow 80ms;
  }
  .pick::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 3px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 140ms ease-out;
    background:
      linear-gradient(90deg, transparent 4%, var(--line) 50%, transparent 96%)
        top/100% 1px no-repeat,
      linear-gradient(90deg, transparent 4%, var(--line) 50%, transparent 96%)
        bottom/100% 1px no-repeat,
      linear-gradient(
          180deg,
          transparent 10%,
          rgba(242, 210, 140, 0.6) 50%,
          transparent 90%
        )
        left/1px 100% no-repeat,
      linear-gradient(
          180deg,
          transparent 10%,
          rgba(242, 210, 140, 0.6) 50%,
          transparent 90%
        )
        right/1px 100% no-repeat,
      radial-gradient(
        120% 140% at 50% 50%,
        rgba(240, 206, 136, 0.07),
        transparent 70%
      );
    box-shadow:
      0 0 16px 1px rgba(232, 196, 120, 0.24),
      inset 0 0 18px rgba(232, 196, 120, 0.12);
  }
  .pick:hover {
    background-color: rgba(255, 248, 230, 0.07);
  }
  .pick:hover::after {
    opacity: 1;
  }
  .pick.sel {
    background: linear-gradient(
      rgba(122, 99, 56, 0.46),
      rgba(74, 59, 34, 0.46)
    );
    box-shadow:
      inset 0 1px 0 rgba(255, 236, 190, 0.2),
      0 0 12px rgba(232, 196, 120, 0.2);
  }
  .pick.sel b {
    color: #fff3d6;
  }

  /* portraits sit in warm light that fades into the panel; no ring, no flat fill */
  .face {
    flex: none;
    display: block;
    object-fit: cover;
    object-position: 50% 14%;
    background: radial-gradient(
      closest-side,
      rgba(236, 200, 128, 0.34),
      rgba(236, 200, 128, 0.12) 55%,
      transparent 82%
    );
    -webkit-mask-image: radial-gradient(
      ellipse 58% 60% at 50% 46%,
      #000 60%,
      transparent 100%
    );
    mask-image: radial-gradient(
      ellipse 58% 60% at 50% 46%,
      #000 60%,
      transparent 100%
    );
    transition: filter 0.14s;
  }
  .pick:hover .face {
    filter: brightness(1.08) drop-shadow(0 0 8px rgba(236, 200, 128, 0.35));
  }
  .f56 {
    width: 56px;
    height: 56px;
  }
  .f64 {
    width: 64px;
    height: 64px;
  }
  .f72 {
    width: 72px;
    height: 72px;
  }
  .f88 {
    width: 88px;
    height: 88px;
  }
  .f120 {
    width: 120px;
    height: 120px;
  }
  .figure {
    display: block;
    height: 100%;
    object-fit: contain;
    object-position: 50% 100%;
    background: radial-gradient(
      ellipse 50% 46% at 50% 55%,
      rgba(236, 200, 128, 0.26),
      rgba(236, 200, 128, 0.08) 60%,
      transparent 85%
    );
    -webkit-mask-image: linear-gradient(180deg, #000 88%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 88%, transparent 100%);
  }

  /* type and data */
  .label {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .big {
    font-size: 17px;
  }
  .muted {
    color: var(--muted);
  }
  .num {
    font-variant-numeric: lining-nums tabular-nums;
  }
  .badge {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--bar-ink);
    flex: none;
    text-shadow: none;
  }
  .bD {
    background: var(--dem);
  }
  .bR {
    background: var(--rep);
  }
  .bI {
    background: var(--ind);
  }
  .bar {
    display: flex;
    height: 21px;
    gap: 2px;
    font-size: 13px;
    font-weight: 600;
    color: var(--bar-ink);
    text-shadow: none;
    font-variant-numeric: tabular-nums;
  }
  .bar i {
    font-style: normal;
    display: flex;
    align-items: center;
    padding: 0 8px;
    white-space: nowrap;
    overflow: hidden;
  }
  .bar i:first-child {
    border-radius: 2px 0 0 2px;
  }
  .bar i:last-child {
    border-radius: 0 2px 2px 0;
  }
  .bar i:only-child {
    border-radius: 2px;
  }
  .y {
    background: var(--yes);
  }
  .n {
    background: var(--no);
    justify-content: flex-end;
  }
  .pD {
    background: var(--dem);
  }
  .pR {
    background: var(--rep);
  }
  .pI {
    background: var(--ind);
  }
  .stats {
    display: grid;
    gap: 8px 18px;
  }
  .stats b {
    display: block;
    font: 500 28px var(--f-ui);
    line-height: 32px;
    font-variant-numeric: lining-nums tabular-nums;
  }
  .stats span {
    font-size: 14px;
    color: var(--muted);
    line-height: 18px;
    display: block;
  }
  .stats em {
    font-style: normal;
    font-size: 13.5px;
    color: var(--gold2);
  }
  .cols {
    display: grid;
    gap: 36px;
    flex: 1;
    min-height: 0;
  }
  .col {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
    min-width: 0;
  }
  .between {
    justify-content: space-between;
  }
  .rows {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 10px;
    margin: 0 -10px;
  }
  .row .grow {
    flex: 1;
    min-width: 0;
  }
  .row b {
    font-weight: 600;
    font-size: 16.5px;
    display: block;
    line-height: 21px;
    color: #fbf6ea;
  }
  .row span {
    font-size: 15px;
    color: var(--muted);
    display: block;
    line-height: 20px;
  }
  .dt {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 0 10px;
    font-size: 15.5px;
    line-height: 23px;
  }
  .dt b {
    color: var(--gold2);
    font-weight: 600;
  }
  .pager {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: flex-end;
    font-size: 14px;
    color: var(--muted);
  }
  .arrow {
    width: 34px;
    height: 30px;
    border: 0;
    border-radius: 2px;
    background: linear-gradient(#3b3934, #22201d);
    color: #e9e2d4;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255, 236, 190, 0.16);
  }
  .arrow:hover {
    box-shadow: 0 0 14px var(--glow);
  }
  .story {
    font: 400 17px/1.6 var(--f-story);
    color: #efe6d4;
  }
  .why {
    font-size: 14px;
    color: var(--muted);
  }
  .picture {
    position: relative;
    flex: none;
    background: center/cover;
    -webkit-mask-image:
      linear-gradient(
        90deg,
        transparent 0,
        #000 7%,
        #000 93%,
        transparent 100%
      ),
      linear-gradient(180deg, transparent 0, #000 14%, #000 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(
        90deg,
        transparent 0,
        #000 7%,
        #000 93%,
        transparent 100%
      ),
      linear-gradient(180deg, transparent 0, #000 14%, #000 100%);
    mask-composite: intersect;
  }
  .picture::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(0, 0, 0, 0) 30%,
      rgba(0, 0, 0, 0.82)
    );
  }
  .picture div {
    position: absolute;
    left: 28px;
    bottom: 12px;
    z-index: 1;
    color: #f7f1e3;
  }
  .picture b {
    font: 700 18px var(--f-title);
    display: block;
    margin-bottom: 3px;
    letter-spacing: 0.3px;
  }
  .picture span {
    font-size: 14.5px;
    opacity: 0.92;
  }
  .term {
    border-bottom: 1px dashed rgba(220, 196, 140, 0.7);
    cursor: help;
  }
  .term.learned {
    border-bottom: 0;
  }
  .tipbox {
    position: absolute;
    z-index: 40;
    max-width: 340px;
    padding: 12px 14px;
    font: 400 15px/1.5 var(--f-ui);
    color: #f6efe0;
    background: rgba(18, 17, 15, 0.96);
    border-radius: 2px;
    box-shadow: 0 0 16px rgba(232, 196, 120, 0.24);
    pointer-events: auto;
    text-shadow: none;
  }
  .tipbox::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(
          90deg,
          transparent 4%,
          rgba(242, 210, 140, 0.8) 50%,
          transparent 96%
        )
        top/100% 1px no-repeat,
      linear-gradient(
          90deg,
          transparent 4%,
          rgba(242, 210, 140, 0.8) 50%,
          transparent 96%
        )
        bottom/100% 1px no-repeat;
  }
  .tipbox b {
    color: var(--gold2);
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
  }
  .tipbox .tline {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    font-variant-numeric: tabular-nums;
  }
  .tipbox .hint {
    display: block;
    margin-top: 6px;
    font-size: 13.5px;
    color: var(--dim);
  }

  /* player card and menu buttons, bottom left */

    let x = (r.left - s.left) / k,
      y = (r.bottom - s.top) / k + 8;
    const w = 340;
    if (x + w > 1420) x = 1420 - w;
    if (y + 120 > 880) y = (r.top - s.top) / k - 110;
    tipEl.style.left = x + "px";
    tipEl.style.top = y + "px";
  }
  function hideTip() {
    tipEl.hidden = true;
  }
  document.addEventListener("mouseover", (e) => {
    const t = e.target.closest("[data-tip]");
    if (t) showTip(t);
    else hideTip();
  });
  document.addEventListener("focusin", (e) => {
    const t = e.target.closest("[data-tip]");
    if (t) showTip(t);
  });
  /* Esc closes the open menu (the only way with Close C, besides its rail button) */
  function closeCard() {
    const h = $("#cardhost");
    if (h) h.innerHTML = "";
  }
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($("#cardhost") && $("#cardhost").innerHTML) {
      closeCard();
      return;
    }
    if (!closed) {
      closed = true;
      hideTip();
      render();
    }
  });
  /* #key~group-value~group-value opens an example with options set, for renders */
  const hash = location.hash.slice(1);
  {
    const [k, ...opts] = hash.split("~");
    if (EX[k]) cur = k;
    for (const p of opts) {
      const [g, v] = p.split("-");
      if (g in OPT) OPT[g] = v;
      if (g === "branch") govBranch = v;
      if (g === "blevel") budLevel = v.replace(/_/g, " ");
      if (g === "csel") calSel = iso(2025, calMonth, +v);
      if (g === "bsel") budSelBy[budLevel] = +v;
      if (g === "card" && GP[v])
        setTimeout(() => {
          $("#cardhost").innerHTML = personCard2(v);
        }, 50);
      if (g === "bill" && BILLS2[v])
        setTimeout(() => {
          $("#cardhost").innerHTML = billCard(v);
        }, 50);
    }
  }
  render();
</script>
