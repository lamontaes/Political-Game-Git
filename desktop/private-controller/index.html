<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Our Civic Duty Private</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="chrome">
    <div class="bar">
      <div class="brand">Our Civic Duty<small>Private hub</small></div>
      <div class="tabs" role="tablist" aria-label="Hub sections">
        <button role="tab" id="tab-play" data-tab="play" aria-selected="true">
          Play
        </button>
        <button
          role="tab"
          id="tab-artdesk"
          data-tab="artdesk"
          aria-selected="false"
        >
          Art Desk
        </button>
        <button
          role="tab"
          id="tab-agents"
          data-tab="agents"
          aria-selected="false"
        >
          Agents
        </button>
        <button
          role="tab"
          id="tab-settings"
          data-tab="settings"
          aria-selected="false"
        >
          Settings
        </button>
      </div>
      <div class="actions">
        <span id="download-note" class="status" role="status" hidden></span>
        <button id="reveal-download" class="ghost" hidden>
          Show in Finder
        </button>
        <button id="copy-ref" class="ghost" hidden>Copy revision</button>
        <button id="check-updates" class="ghost">Check for updates</button>
        <button
          id="return-title"
          class="ghost"
          title="Back to the game's title screen; your life is not reset"
        >
          Return to title
        </button>
        <button id="apply" class="primary" hidden>
          Restart Play on update
        </button>
        <button id="return-main" class="ghost" hidden>Back to main game</button>
        <button id="cancel-build" class="ghost" hidden>Cancel</button>
      </div>
    </div>
    <div class="bar sub">
      <div class="track">
        <label for="track">Game build</label>
        <select id="track">
          <option value="main">Main game (recommended)</option>
        </select>
        <button
          id="build-details"
          class="ghost icon"
          aria-expanded="false"
          aria-controls="status"
          title="Show the exact branch and revision"
        >
          ⓘ
        </button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">
        Reading the installed build…
      </div>
    </div>
    <script src="chrome.mjs" type="module"></script>
  </body>
</html>
