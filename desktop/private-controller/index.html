<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Our Civic Duty Private</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="chrome">
    <div class="bar">
      <div class="brand">Our Civic Duty<small>Private hub</small></div>
      <div class="tabs" role="tablist" aria-label="Hub sections">
        <button role="tab" id="tab-play" data-tab="play" aria-selected="true">
          Play
        </button>
        <button
          role="tab"
          id="tab-artdesk"
          data-tab="artdesk"
          aria-selected="false"
        >
          Art Desk
        </button>
        <button
          role="tab"
          id="tab-agents"
          data-tab="agents"
          aria-selected="false"
        >
          Agents
        </button>
        <button
          role="tab"
          id="tab-settings"
          data-tab="settings"
          aria-selected="false"
        >
          Settings
        </button>
      </div>
      <div class="track">
        <label for="track">Source</label>
        <select id="track" aria-label="Play source">
          <option value="main">Follow main</option>
        </select>
        <button
          id="refresh-branches"
          class="ghost"
          title="Refresh the branch list"
        >
          ↻
        </button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">
        Reading the installed build…
      </div>
      <button id="apply" class="primary" hidden>Restart Play on update</button>
      <button id="return-main" class="ghost" hidden>Return to main</button>
      <button id="cancel-build" class="ghost" hidden>Cancel build</button>
    </div>
    <script src="chrome.mjs" type="module"></script>
  </body>
</html>
