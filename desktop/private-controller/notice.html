<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Notice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page notice">
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title">Preparing…</h1>
        <p id="message" class="muted" role="status" aria-live="polite"></p>
        <div class="row" data-center id="actions"></div>
        <pre id="log" class="log" hidden></pre>
      </div>
    </main>
    <script src="notice.mjs" type="module"></script>
  </body>
</html>
