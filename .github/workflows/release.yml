name: Release

on:
  push:
    branches: [main]
  # Manual final drain for a release candidate that lost a main fast-forward
  # race and had no later merge to trigger another run.
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_candidate:
    name: Build and validate candidate (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[release-automation]')
    outputs:
      outcome: ${{ steps.plan.outputs.outcome }}
      next_version: ${{ steps.plan.outputs.next }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      candidate_tree: ${{ steps.candidate.outputs.candidate_tree }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      DECLARATION_BASE: ${{ github.event_name == 'push' && github.event.before || github.sha }}
    steps:
      - name: Check out the exact pushed revision without write credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Enforce declarations for the exact incoming range
        run: >-
          npm run release:check --
          --base "$DECLARATION_BASE"
          --head "$SOURCE_SHA"
          --mode push

      - name: Decide what this revision releases
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/release-plan.json"
          npm run --silent release:preview -- --json > "$plan"
          outcome="$(jq -er '.outcome' "$plan")"
          next="$(jq -er '.nextVersion' "$plan")"
          printf 'outcome=%s\nnext=%s\n' "$outcome" "$next" >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo
            echo "- outcome: \`$outcome\`"
            echo "- current: \`$(jq -er '.currentVersion' "$plan")\`"
            echo "- next: \`$next\`"
            reason="$(jq -r '.reason // empty' "$plan")"
            if [[ -n "$reason" ]]; then echo "- reason: $reason"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply and create the candidate commit locally
        id: candidate
        if: steps.plan.outputs.outcome == 'release'
        env:
          NEXT_VERSION: ${{ steps.plan.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail
          npm run release:apply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json PATCH_NOTES.md \
            docs/release/consumed-changes.json docs/release/changes
          git diff --cached --quiet && {
            echo "::error::Release plan produced no candidate delta."
            exit 1
          }
          git -c commit.gpgsign=false commit -m "Release ${NEXT_VERSION} [release-automation]"
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          source_sha="$(git rev-parse 'HEAD^')"
          [[ "$source_sha" == "$SOURCE_SHA" ]]
          [[ "$(git rev-list --count "${SOURCE_SHA}..${candidate_sha}")" == "1" ]]
          [[ -z "$(git status --porcelain)" ]]
          printf 'source_sha=%s\ncandidate_sha=%s\ncandidate_tree=%s\n' \
            "$source_sha" "$candidate_sha" "$candidate_tree" >> "$GITHUB_OUTPUT"

      - name: Validate and build the exact clean candidate commit
        if: steps.plan.outputs.outcome == 'release'
        env:
          RELEASE_DECLARATION_BASE: ${{ env.DECLARATION_BASE }}
          RELEASE_DECLARATION_HEAD: ${{ env.SOURCE_SHA }}
          RELEASE_DECLARATION_MODE: push
        run: npm run validate

      - name: Prove validation did not change candidate identity
        if: steps.plan.outputs.outcome == 'release'
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.candidate_tree }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$CANDIDATE_TREE" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Package the validated commit as inert Git object data
        id: bundle
        if: steps.plan.outputs.outcome == 'release'
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.candidate_tree }}
          NEXT_VERSION: ${{ steps.plan.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-candidate"
          mkdir -p "$artifact_dir"
          git bundle create "$artifact_dir/release-candidate.bundle" HEAD "^${SOURCE_SHA}"
          bundle_sha256="$(sha256sum "$artifact_dir/release-candidate.bundle" | awk '{print $1}')"
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg candidateTree "$CANDIDATE_TREE" \
            --arg version "$NEXT_VERSION" \
            --arg bundleSha256 "$bundle_sha256" \
            '{schemaVersion:1,sourceSha:$sourceSha,candidateSha:$candidateSha,candidateTree:$candidateTree,version:$version,bundleSha256:$bundleSha256}' \
            > "$artifact_dir/manifest.json"
          git format-patch --stdout -1 "$CANDIDATE_SHA" > "$artifact_dir/staged-release.patch"
          printf 'bundle_sha256=%s\n' "$bundle_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the exact validated candidate
        if: steps.plan.outputs.outcome == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: validated-release-candidate
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 14

      - name: Report staged-only behavior
        if: steps.plan.outputs.outcome == 'release' && vars.RELEASE_AUTOMATION != 'enabled'
        shell: bash
        run: |
          {
            echo
            echo "Release automation is not enabled, so the validated candidate was not published."
            echo "The exact candidate bundle and a review patch are attached to this run."
            echo "Activation requires the repository variable RELEASE_AUTOMATION to equal \`enabled\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a blocked release
        if: steps.plan.outputs.outcome == 'blocked'
        shell: bash
        run: |
          echo "::error::This revision has pending changes that cannot be released automatically. Nothing was published and no declaration was consumed."
          exit 1

  publish_candidate:
    name: Publish exact candidate (minimal write authority)
    needs: build_candidate
    if: >-
      needs.build_candidate.result == 'success' &&
      needs.build_candidate.outputs.outcome == 'release' &&
      vars.RELEASE_AUTOMATION == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      # Deliberately no checkout, setup-node, npm, dependency hooks, or call to
      # repository scripts. The write token sees only the validated Git bundle.
      - name: Download the validated candidate data
        uses: actions/download-artifact@v7
        with:
          name: validated-release-candidate
          path: ${{ runner.temp }}/release-candidate

      - name: Verify the candidate and publish it onto main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build_candidate.outputs.source_sha }}
          CANDIDATE_SHA: ${{ needs.build_candidate.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ needs.build_candidate.outputs.candidate_tree }}
          BUNDLE_SHA256: ${{ needs.build_candidate.outputs.bundle_sha256 }}
          NEXT_VERSION: ${{ needs.build_candidate.outputs.next_version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-candidate"
          bundle="$artifact_dir/release-candidate.bundle"
          manifest="$artifact_dir/manifest.json"
          patch="$artifact_dir/staged-release.patch"
          [[ "$(find "$artifact_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" == "3" ]]
          [[ -f "$bundle" && ! -L "$bundle" ]]
          [[ -f "$manifest" && ! -L "$manifest" ]]
          [[ -f "$patch" && ! -L "$patch" ]]
          [[ "$(sha256sum "$bundle" | awk '{print $1}')" == "$BUNDLE_SHA256" ]]
          [[ "$(jq -er '.schemaVersion' "$manifest")" == "1" ]]
          [[ "$(jq -er '.sourceSha' "$manifest")" == "$SOURCE_SHA" ]]
          [[ "$(jq -er '.candidateSha' "$manifest")" == "$CANDIDATE_SHA" ]]
          [[ "$(jq -er '.candidateTree' "$manifest")" == "$CANDIDATE_TREE" ]]
          [[ "$(jq -er '.version' "$manifest")" == "$NEXT_VERSION" ]]
          [[ "$(jq -er '.bundleSha256' "$manifest")" == "$BUNDLE_SHA256" ]]

          publisher="$RUNNER_TEMP/release-publisher"
          git init -q "$publisher"
          cd "$publisher"
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add origin "$remote_url"
          # The checked parent is fetched by id, so main may already have moved on.
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git bundle verify "$bundle"
          git fetch --no-tags "$bundle" HEAD:refs/candidates/release
          [[ "$(git rev-parse refs/candidates/release)" == "$CANDIDATE_SHA" ]]
          [[ "$(git rev-parse "${CANDIDATE_SHA}^{tree}")" == "$CANDIDATE_TREE" ]]
          [[ "$(git show -s --format=%P "$CANDIDATE_SHA")" == "$SOURCE_SHA" ]]
          subject="Release ${NEXT_VERSION} [release-automation]"
          [[ "$(git show -s --format=%s "$CANDIDATE_SHA")" == "$subject" ]]

          seen_package=0
          seen_lock=0
          seen_notes=0
          seen_ledger=0
          declaration_deletes=0
          delta="$RUNNER_TEMP/release-delta"
          : > "$delta"
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            [[ "$path" != /* && "$path" != *$'\n'* && "$path" != *$'\r'* && "$path" != *$'\t'* ]]
            case "/$path/" in
              */../*|*/./*|*//*) echo "::error::Unsafe candidate path: $path"; exit 1 ;;
            esac
            case "$path:$status" in
              package.json:M) seen_package=1 ;;
              package-lock.json:M) seen_lock=1 ;;
              PATCH_NOTES.md:M) seen_notes=1 ;;
              docs/release/consumed-changes.json:M) seen_ledger=1 ;;
              docs/release/changes/*.md:D)
                declaration="${path#docs/release/changes/}"
                [[ "$declaration" != */* ]]
                [[ "$declaration" =~ ^[a-z0-9][a-z0-9-]*\.md$ ]]
                declaration_deletes=$((declaration_deletes + 1))
                ;;
              *) echo "::error::Candidate contains forbidden delta $status $path"; exit 1 ;;
            esac
            if [[ "$status" != "D" ]]; then
              entry="$(git ls-tree "$CANDIDATE_SHA" -- "$path")"
              [[ "${entry%% *}" == "100644" ]]
            fi
            printf '%s\t%s\n' "$status" "$path" >> "$delta"
          done < <(git diff-tree --no-commit-id --name-status -r -z "$SOURCE_SHA" "$CANDIDATE_SHA")
          [[ "$seen_package" == 1 && "$seen_lock" == 1 && "$seen_notes" == 1 && "$seen_ledger" == 1 ]]
          [[ "$declaration_deletes" -ge 1 ]]

          package_version="$(git show "${CANDIDATE_SHA}:package.json" | jq -er '.version | select(type == "string")')"
          lock_version="$(git show "${CANDIDATE_SHA}:package-lock.json" | jq -er '.version | select(type == "string")')"
          lock_root_version="$(git show "${CANDIDATE_SHA}:package-lock.json" | jq -er '.packages[""].version | select(type == "string")')"
          [[ "$package_version" == "$NEXT_VERSION" ]]
          [[ "$lock_version" == "$package_version" ]]
          [[ "$lock_root_version" == "$package_version" ]]

          # Main keeps moving while the candidate is validated. The release
          # delta touches only release metadata, so when main has moved the
          # same delta is laid onto main's new tip, provided every file it
          # touches is still byte-identical to the validated parent. Anything
          # else is left for the next push, whose run releases what is pending.
          for attempt in 1 2 3 4 5; do
            remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [[ "$remote_head" == "$SOURCE_SHA" ]]; then
              target="$CANDIDATE_SHA"
            else
              git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
              main_tip="$(git rev-parse refs/remotes/origin/main)"
              while IFS=$'\t' read -r status path; do
                if [[ "$(git rev-parse -q --verify "${SOURCE_SHA}:${path}" || true)" != \
                      "$(git rev-parse -q --verify "${main_tip}:${path}" || true)" ]]; then
                  echo "::warning::main changed $path after the candidate was validated. Nothing was published; the next push releases what is pending."
                  exit 0
                fi
              done < "$delta"
              index="$RUNNER_TEMP/release-index"
              rm -f "$index"
              GIT_INDEX_FILE="$index" git read-tree "$main_tip"
              while IFS=$'\t' read -r status path; do
                if [[ "$status" == "D" ]]; then
                  GIT_INDEX_FILE="$index" git update-index --force-remove -- "$path"
                else
                  blob="$(git rev-parse "${CANDIDATE_SHA}:${path}")"
                  GIT_INDEX_FILE="$index" git update-index --add --cacheinfo "100644,${blob},${path}"
                fi
              done < "$delta"
              tree="$(GIT_INDEX_FILE="$index" git write-tree)"
              target="$(git commit-tree "$tree" -p "$main_tip" -m "$subject")"
              [[ "$(git diff-tree --no-commit-id --name-status -r "$main_tip" "$target")" == \
                 "$(git diff-tree --no-commit-id --name-status -r "$SOURCE_SHA" "$CANDIDATE_SHA")" ]]
              for path in package.json package-lock.json PATCH_NOTES.md docs/release/consumed-changes.json; do
                [[ "$(git rev-parse "${target}:${path}")" == "$(git rev-parse "${CANDIDATE_SHA}:${path}")" ]]
              done
            fi

            if git push origin "${target}:refs/heads/main"; then
              echo "Published release ${NEXT_VERSION} as $target (validated candidate $CANDIDATE_SHA)."
              exit 0
            fi
            remote_after="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [[ "$remote_after" == "$remote_head" ]]; then
              echo "::error::Publication failed while main had not moved. Nothing was published."
              exit 1
            fi
            echo "main moved during publication (attempt $attempt); laying the release onto the new tip."
          done
          echo "::warning::main kept moving through five attempts. Nothing was published; the next push releases what is pending."
          exit 0
