name: Checks guard
# No session edits the checks that judge it. This workflow runs the
# check-changes guard and its rules from main (pull_request_target), so a pull
# request cannot loosen its own judge. It reads the pull request's files
# through git only and never runs them. A refused change needs a line from the
# CTO on the crew issue that approves the pull request by number; re-run this
# job after that line is posted. docs/design/guards.md, "check-changes".
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: checks-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check-changes:
    name: check-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Main's copy of the guard and its rules, without file contents: the
      # guard asks git for the few files a pull request changed.
      - name: Check out main's guard
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts/guards
            tests/guards
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Judge the pull request's changes by main's rules
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --filter=blob:none origin "pull/${PR_NUMBER}/head"
          base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          node scripts/guards/check-changes.mjs --base "$base" --head "$PR_HEAD_SHA"
