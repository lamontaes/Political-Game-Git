name: Deterministic validation

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Repository validation plus 249 browser tests exceeded the 20-minute job budget.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The ownership-boundary suite diffs this branch against the commit it
          # was cut from. On a pull_request event Actions checks out the
          # synthetic merge ref, and the default depth of 1 leaves that base
          # commit outside the clone, so the check cannot run. Fetch the full
          # history so history-dependent validation has something to measure.
          fetch-depth: 0
          # Acceptance is for the published PR head, not a synthetic merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run repository validation
        run: npm run validate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Run A and Run B browser proofs
        run: npm run test:e2e

      - name: Preserve browser failure evidence
        # Best effort: a hard runner termination can still prevent upload.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
