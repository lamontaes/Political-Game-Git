name: Deterministic validation

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  repository:
    name: repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The ownership-boundary suite diffs this branch against the commit it
          # was cut from. On a pull_request event Actions checks out the
          # synthetic merge ref, and the default depth of 1 leaves that base
          # commit outside the clone, so the check cannot run. Fetch the full
          # history so history-dependent validation has something to measure.
          fetch-depth: 0
          # Acceptance is for the published PR head, not a synthetic merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run repository validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VALIDATED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            declaration_base="$PR_BASE_SHA"
            declaration_mode="pr"
          elif [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            declaration_base="$EVENT_BEFORE"
            declaration_mode="push"
          else
            declaration_base="$(git merge-base HEAD origin/main)"
            declaration_mode="pr"
          fi
          RELEASE_DECLARATION_BASE="$declaration_base" \
          RELEASE_DECLARATION_HEAD="$VALIDATED_HEAD_SHA" \
          RELEASE_DECLARATION_MODE="$declaration_mode" \
            npm run validate:ci-sharded

      # The unit suite runs in the `unit` shards below. This job records the
      # whole suite's file list so `validate` can prove the shards partition it.
      - name: Record the baseline unit suite
        run: |
          mkdir -p test-results/unit-baseline
          npx vitest list --filesOnly > test-results/unit-baseline/files.txt
          wc -l test-results/unit-baseline/files.txt

      - name: Upload the baseline unit suite
        uses: actions/upload-artifact@v7
        with:
          name: unit-suite-baseline
          path: test-results/unit-baseline/files.txt
          if-no-files-found: error
          retention-days: 14

      - name: Record the baseline Playwright suite
        env:
          PG_RUN_ID: gha-${{ github.run_id }}-baseline
        run: node --import tsx scripts/dev-lab/write-e2e-baseline-inventory.ts

      - name: Upload the baseline Playwright suite
        uses: actions/upload-artifact@v7
        with:
          name: playwright-suite-baseline
          path: test-results/runs/gha-${{ github.run_id }}-baseline/baseline-inventory.json
          if-no-files-found: error
          retention-days: 14

  unit:
    name: unit
    runs-on: ubuntu-latest
    # The composed unit suite passed the single repository job's 45-minute cap
    # on three consecutive heads (the suite alone took over 42 minutes on the
    # hosted runner; 17 minutes before the CRUNCH46 lanes joined). Four shards
    # keep the complete-suite/union contract the browser job already uses
    # while giving each runner a bounded share; no test is skipped or given
    # more time, and `validate` refuses a run whose shards do not partition
    # the whole suite.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            total: 6
          - shard: 2
            total: 6
          - shard: 3
            total: 6
          - shard: 4
            total: 6
          - shard: 5
            total: 6
          - shard: 6
            total: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run unit shard ${{ matrix.shard }} of ${{ matrix.total }}
        run: |
          mkdir -p test-results/unit-shards
          npx vitest run --shard=${{ matrix.shard }}/${{ matrix.total }} \
            --reporter=default --reporter=json \
            --outputFile.json=test-results/unit-shards/shard-${{ matrix.shard }}-of-${{ matrix.total }}.json

      - name: Upload this shard's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-shard-report-${{ matrix.shard }}-of-${{ matrix.total }}
          path: test-results/unit-shards/shard-${{ matrix.shard }}-of-${{ matrix.total }}.json
          if-no-files-found: error
          retention-days: 14

  browser:
    name: browser
    runs-on: ubuntu-latest
    # Two shards reached the 75-minute cap on the composed landing without a
    # gameplay assertion, and with four, three shards did the same on the
    # CRUNCH47 composition (shard 1 alone took 48 minutes). Eight keep the same
    # complete-suite/union contract while giving each isolated runner a
    # bounded share of the browser work.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            total: 8
          - shard: 2
            total: 8
          - shard: 3
            total: 8
          - shard: 4
            total: 8
          - shard: 5
            total: 8
          - shard: 6
            total: 8
          - shard: 7
            total: 8
          - shard: 8
            total: 8
    env:
      PG_RUN_ID: gha-${{ github.run_id }}-s${{ matrix.shard }}of${{ matrix.total }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated Artbench test storage and identity
        shell: bash
        run: |
          set -euo pipefail
          # Both the test worker and its identified server inherit these values.
          # Keep QA events out of the owner's durable store and Drive mirror.
          bench_root="$(mktemp -d "${RUNNER_TEMP:?}/ocd-artbench-XXXXXXXX")"
          mkdir -m 700 "$bench_root/data"
          {
            printf 'PG_ARTBENCH_DATA_ROOT=%s\n' "$bench_root/data"
            # An explicit absent mirror prevents fallback to an owner's mirror.
            printf 'PG_ARTBENCH_DRIVE_ROOT=%s\n' "$bench_root/drive-mirror"
            printf 'PG_ARTBENCH_OWNER_ID=%s\n' 'e2e-fixture-owner'
          } >> "${GITHUB_ENV:?}"

      - name: Enumerate this browser shard
        run: node --import tsx scripts/dev-lab/write-e2e-shard-inventory.ts ${{ matrix.shard }} ${{ matrix.total }}

      # The packet is generated output and is no longer committed, and its
      # spec skips itself when the file is absent. Without this the assertion
      # would quietly stop running in CI, so the shard that carries the spec
      # builds the packet first. Every other shard skips the work.
      - name: Generate the prose review packet when this shard carries its spec
        shell: bash
        run: |
          set -euo pipefail
          inventory="test-results/runs/${PG_RUN_ID:?}/shard-inventory.json"
          if grep -q 'prose-review-packet.spec.ts' "$inventory"; then
            npm run corpus:prose
          else
            echo "This shard does not carry the packet spec; nothing to build."
          fi

      - name: Run Run A and Run B browser proofs
        run: npx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload this shard inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-shard-inventory-${{ matrix.shard }}-of-${{ matrix.total }}
          path: test-results/runs/${{ env.PG_RUN_ID }}/shard-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve browser failure evidence
        # Best effort: a hard runner termination can still prevent upload.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence-shard-${{ matrix.shard }}-of-${{ matrix.total }}
          path: test-results/runs/${{ env.PG_RUN_ID }}
          if-no-files-found: ignore
          retention-days: 14

  validate:
    name: validate
    if: always()
    needs:
      - repository
      - unit
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every mandatory job
        shell: bash
        run: |
          set -euo pipefail
          repository='${{ needs.repository.result }}'
          unit='${{ needs.unit.result }}'
          browser='${{ needs.browser.result }}'
          echo "repository=$repository"
          echo "unit=$unit"
          echo "browser=$browser"
          if [[ "$repository" != "success" || "$unit" != "success" || "$browser" != "success" ]]; then
            echo "Aggregate validate succeeds only when every mandatory job succeeded."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Download the baseline unit suite
        uses: actions/download-artifact@v7
        with:
          name: unit-suite-baseline
          path: /tmp/unit-suite-baseline

      - name: Download unit shard reports
        uses: actions/download-artifact@v7
        with:
          pattern: unit-shard-report-*
          path: /tmp/unit-shard-reports

      - name: Confirm unit shard union equals the baseline suite
        run: node --import tsx scripts/dev-lab/assert-unit-shard-union.ts /tmp/unit-suite-baseline/files.txt /tmp/unit-shard-reports

      - name: Download the baseline Playwright suite
        uses: actions/download-artifact@v7
        with:
          name: playwright-suite-baseline
          path: /tmp/playwright-suite-baseline

      - name: Download shard inventories
        uses: actions/download-artifact@v7
        with:
          pattern: playwright-shard-inventory-*
          path: /tmp/playwright-shard-inventories

      - name: Confirm shard union equals the baseline suite
        run: node --import tsx scripts/dev-lab/assert-e2e-shard-union.ts /tmp/playwright-suite-baseline/baseline-inventory.json /tmp/playwright-shard-inventories
