name: Deterministic validation

# The browser suite lives in browser.yml since 2026-09-22, split out with
# lamontae's approval so the unit shards stop queueing behind 21-to-59-minute
# browser shards. This workflow is the fast one: repository plus six unit
# shards, about 38 job-minutes, and the aggregate `validate` below no longer
# waits on the browser suite. Making the browser suite gate merging again is a
# branch-protection change, not a change here.

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

# A new commit supersedes its own predecessor, so the predecessor's run stops.
# Without this, every push left this workflow's jobs in a shared queue, and on
# 2026-09-22 that grew to roughly two thousand queued jobs and several hours in
# which no branch could get a verdict at all. (It was fifteen jobs per push
# before the browser suite moved to browser.yml; it is eight now.)
#
# NOT on main. Cancel-in-progress is deliberately false there, because main's
# run is the base verdict every lane reads to tell a failure it inherited from
# one it caused. That is not academic: three browser shards were failing on
# main the night this was written, and if pushes to main had been canceling
# each other's runs, nobody could have established that.
#
# The key separates the push run from the pull_request run of the same ref.
# Branch protection may read either, and canceling one to save the other would
# be guessing which.
#
# A canceled required job reads as red to the aggregate `validate` job, which
# exits 1 with nothing to aggregate. That only ever happens on a commit that is
# no longer the branch's head, so it cannot block a merge — but a canceled run
# on an older commit is a superseded run, not a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  repository:
    name: repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The ownership-boundary suite diffs this branch against the commit it
          # was cut from. On a pull_request event Actions checks out the
          # synthetic merge ref, and the default depth of 1 leaves that base
          # commit outside the clone, so the check cannot run. Fetch the full
          # history so history-dependent validation has something to measure.
          fetch-depth: 0
          # Acceptance is for the published PR head, not a synthetic merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run repository validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VALIDATED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            declaration_base="$PR_BASE_SHA"
            declaration_mode="pr"
          elif [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            declaration_base="$EVENT_BEFORE"
            declaration_mode="push"
          else
            declaration_base="$(git merge-base HEAD origin/main)"
            declaration_mode="pr"
          fi
          RELEASE_DECLARATION_BASE="$declaration_base" \
          RELEASE_DECLARATION_HEAD="$VALIDATED_HEAD_SHA" \
          RELEASE_DECLARATION_MODE="$declaration_mode" \
            npm run validate:ci-sharded

      # The unit suite runs in the `unit` shards below. This job records the
      # whole suite's file list so `validate` can prove the shards partition it.
      - name: Record the baseline unit suite
        run: |
          mkdir -p test-results/unit-baseline
          npx vitest list --filesOnly > test-results/unit-baseline/files.txt
          wc -l test-results/unit-baseline/files.txt

      - name: Upload the baseline unit suite
        uses: actions/upload-artifact@v7
        with:
          name: unit-suite-baseline
          path: test-results/unit-baseline/files.txt
          if-no-files-found: error
          retention-days: 14

  unit:
    name: unit
    runs-on: ubuntu-latest
    # The composed unit suite passed the single repository job's 45-minute cap
    # on three consecutive heads (the suite alone took over 42 minutes on the
    # hosted runner; 17 minutes before the CRUNCH46 lanes joined). Six shards
    # keep the same complete-suite/union contract the browser shards use in
    # browser.yml, while giving each runner a bounded share; no test is
    # skipped or given
    # more time, and `validate` refuses a run whose shards do not partition
    # the whole suite.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            total: 6
          - shard: 2
            total: 6
          - shard: 3
            total: 6
          - shard: 4
            total: 6
          - shard: 5
            total: 6
          - shard: 6
            total: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run unit shard ${{ matrix.shard }} of ${{ matrix.total }}
        run: |
          mkdir -p test-results/unit-shards
          npx vitest run --shard=${{ matrix.shard }}/${{ matrix.total }} \
            --reporter=default --reporter=json \
            --outputFile.json=test-results/unit-shards/shard-${{ matrix.shard }}-of-${{ matrix.total }}.json

      - name: Upload this shard's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-shard-report-${{ matrix.shard }}-of-${{ matrix.total }}
          path: test-results/unit-shards/shard-${{ matrix.shard }}-of-${{ matrix.total }}.json
          if-no-files-found: error
          retention-days: 14

  validate:
    name: validate
    if: always()
    needs:
      - repository
      - unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every mandatory job
        shell: bash
        run: |
          set -euo pipefail
          repository='${{ needs.repository.result }}'
          unit='${{ needs.unit.result }}'
          echo "repository=$repository"
          echo "unit=$unit"
          if [[ "$repository" != "success" || "$unit" != "success" ]]; then
            echo "Aggregate validate succeeds only when every mandatory job succeeded."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Download the baseline unit suite
        uses: actions/download-artifact@v7
        with:
          name: unit-suite-baseline
          path: /tmp/unit-suite-baseline

      - name: Download unit shard reports
        uses: actions/download-artifact@v7
        with:
          pattern: unit-shard-report-*
          path: /tmp/unit-shard-reports

      - name: Confirm unit shard union equals the baseline suite
        run: node --import tsx scripts/dev-lab/assert-unit-shard-union.ts /tmp/unit-suite-baseline/files.txt /tmp/unit-shard-reports
