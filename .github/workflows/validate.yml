name: Deterministic validation

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  repository:
    name: repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The ownership-boundary suite diffs this branch against the commit it
          # was cut from. On a pull_request event Actions checks out the
          # synthetic merge ref, and the default depth of 1 leaves that base
          # commit outside the clone, so the check cannot run. Fetch the full
          # history so history-dependent validation has something to measure.
          fetch-depth: 0
          # Acceptance is for the published PR head, not a synthetic merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run repository validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VALIDATED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            declaration_base="$PR_BASE_SHA"
            declaration_mode="pr"
          elif [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            declaration_base="$EVENT_BEFORE"
            declaration_mode="push"
          else
            declaration_base="$(git merge-base HEAD origin/main)"
            declaration_mode="pr"
          fi
          RELEASE_DECLARATION_BASE="$declaration_base" \
          RELEASE_DECLARATION_HEAD="$VALIDATED_HEAD_SHA" \
          RELEASE_DECLARATION_MODE="$declaration_mode" \
            npm run validate

      - name: Record the baseline Playwright suite
        env:
          PG_RUN_ID: gha-${{ github.run_id }}-baseline
        run: node --import tsx scripts/dev-lab/write-e2e-baseline-inventory.ts

      - name: Upload the baseline Playwright suite
        uses: actions/upload-artifact@v7
        with:
          name: playwright-suite-baseline
          path: test-results/runs/gha-${{ github.run_id }}-baseline/baseline-inventory.json
          if-no-files-found: error
          retention-days: 14

  browser:
    name: browser
    runs-on: ubuntu-latest
    # LAND already raised the combined-job budget to 75 minutes (164/166).
    # Keep that budget on each isolated browser runner. Do not reopen those
    # landings. A 45-minute cap is still present on some UI branches; that is
    # a branch difference, not a reason to lower main.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            total: 2
          - shard: 2
            total: 2
    env:
      PG_RUN_ID: gha-${{ github.run_id }}-s${{ matrix.shard }}of${{ matrix.total }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Enumerate this browser shard
        run: node --import tsx scripts/dev-lab/write-e2e-shard-inventory.ts ${{ matrix.shard }} ${{ matrix.total }}

      - name: Run Run A and Run B browser proofs
        run: npx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload this shard inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-shard-inventory-${{ matrix.shard }}-of-${{ matrix.total }}
          path: test-results/runs/${{ env.PG_RUN_ID }}/shard-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve browser failure evidence
        # Best effort: a hard runner termination can still prevent upload.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence-shard-${{ matrix.shard }}-of-${{ matrix.total }}
          path: test-results/runs/${{ env.PG_RUN_ID }}
          if-no-files-found: ignore
          retention-days: 14

  validate:
    name: validate
    if: always()
    needs:
      - repository
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every mandatory job
        shell: bash
        run: |
          set -euo pipefail
          repository='${{ needs.repository.result }}'
          browser='${{ needs.browser.result }}'
          echo "repository=$repository"
          echo "browser=$browser"
          if [[ "$repository" != "success" || "$browser" != "success" ]]; then
            echo "Aggregate validate succeeds only when every mandatory job succeeded."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Download the baseline Playwright suite
        uses: actions/download-artifact@v7
        with:
          name: playwright-suite-baseline
          path: /tmp/playwright-suite-baseline

      - name: Download shard inventories
        uses: actions/download-artifact@v7
        with:
          pattern: playwright-shard-inventory-*
          path: /tmp/playwright-shard-inventories

      - name: Confirm shard union equals the baseline suite
        run: node --import tsx scripts/dev-lab/assert-e2e-shard-union.ts /tmp/playwright-suite-baseline/baseline-inventory.json /tmp/playwright-shard-inventories
