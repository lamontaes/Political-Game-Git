name: Deterministic validation

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Repository validation plus browser proofs exceeded the 30-minute job
    # budget, then 45 minutes after EDU-PATH7 landed. ENV composition's hosted
    # run 34625861616 hit 45m during Playwright with repository validation
    # already green. The proofs still have to finish; this is not a skip.
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The ownership-boundary suite diffs this branch against the commit it
          # was cut from. On a pull_request event Actions checks out the
          # synthetic merge ref, and the default depth of 1 leaves that base
          # commit outside the clone, so the check cannot run. Fetch the full
          # history so history-dependent validation has something to measure.
          fetch-depth: 0
          # Acceptance is for the published PR head, not a synthetic merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run repository validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VALIDATED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            declaration_base="$PR_BASE_SHA"
            declaration_mode="pr"
          elif [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            declaration_base="$EVENT_BEFORE"
            declaration_mode="push"
          else
            declaration_base="$(git merge-base HEAD origin/main)"
            declaration_mode="pr"
          fi
          RELEASE_DECLARATION_BASE="$declaration_base" \
          RELEASE_DECLARATION_HEAD="$VALIDATED_HEAD_SHA" \
          RELEASE_DECLARATION_MODE="$declaration_mode" \
            npm run validate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Run A and Run B browser proofs
        run: npm run test:e2e

      - name: Preserve browser failure evidence
        # Best effort: a hard runner termination can still prevent upload.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
