name: Deterministic validation

# The browser workflow (browser.yml) was deleted on 2026-10-24 and no Playwright
# suite runs wholesale. This workflow is the fast one: repository plus six unit
# shards, about 38 job-minutes, and the one browser check that holds the menu
# look (the ui-look job: no box in a box, no scroll with free space).

on:
  pull_request:
  # Main is validated once an hour, not on every push (owner, Oct 28: the CI
  # queue reached 85 runs on 12 runners at thirty merges an hour, and every
  # merge's pull request had already run this workflow on the merged result).
  # The Release workflow still builds and typechecks every push to main.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new commit supersedes its own predecessor, so the predecessor's run stops.
# Without this, every push left this workflow's jobs in a shared queue, and on
# 2026-09-22 that grew to roughly two thousand queued jobs and several hours in
# which no branch could get a verdict at all. (It is eight jobs per push now.)
#
# The key separates the push run from the pull_request run of the same ref.
# Branch protection may read either, and canceling one to save the other would
# be guessing which.
#
# A canceled required job reads as red to the aggregate `validate` job, which
# exits 1 with nothing to aggregate. That only ever happens on a commit that is
# no longer the branch's head, so it cannot block a merge — but a canceled run
# on an older commit is a superseded run, not a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Owner rule (Oct 1, 2026): a newer push replaces the older pull request run,
  # so runs never queue up behind each other. Hourly and manual runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # On a pull_request event Actions checks out the synthetic merge ref,
          # and the default depth of 1 leaves the base commit outside the
          # clone. Fetch the full history so history-dependent validation (the
          # release declaration diff) has something to measure.
          fetch-depth: 0
          # Acceptance is for the published PR head, not a synthetic merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Check only the files this change touches
        # Owner rule (Oct 12, 2026): never run the full repository. Formatting,
        # lint and release declarations cover only the files
        # this pull request (or push) adds or edits; a change never fails on
        # files it didn't touch. Whole-repo typecheck and data validations are
        # not part of this check.
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VALIDATED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base HEAD "$PR_BASE_SHA")"
            declaration_base="$PR_BASE_SHA"
            declaration_mode="pr"
          elif [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            base="$EVENT_BEFORE"
            declaration_base="$EVENT_BEFORE"
            declaration_mode="push"
          else
            base="$(git rev-parse HEAD~1)"
            declaration_base="$(git merge-base HEAD origin/main)"
            declaration_mode="pr"
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=AMR "$base" HEAD)
          printf 'Checking %s changed file(s).\n' "${#changed[@]}"
          if [[ ${#changed[@]} -eq 0 ]]; then
            exit 0
          fi
          printf '%s\n' "${changed[@]}" | xargs -r -d '\n' -n 400 npx prettier --check --ignore-unknown
          mapfile -t code < <(printf '%s\n' "${changed[@]}" | grep -E '\.(ts|tsx|js|mjs|cjs)$' || true)
          if [[ ${#code[@]} -gt 0 ]]; then
            printf '%s\n' "${code[@]}" | xargs -r -d '\n' -n 400 npx eslint --no-warn-ignored
          fi
          RELEASE_DECLARATION_BASE="$declaration_base" \
          RELEASE_DECLARATION_HEAD="$VALIDATED_HEAD_SHA" \
          RELEASE_DECLARATION_MODE="$declaration_mode" \
            npm run release:check

  guards:
    name: guards
    # Every standing-rule guard, on every pull request and push, whatever the
    # change touches. The list, each guard's rule and where to read it live in
    # scripts/guards/index.ts; docs/design/guards.md explains each one.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The guards judge what main becomes: the pull request merged into
          # its base (GitHub's merge commit), so a branch cut before a guard
          # existed is judged by today's guards, not by its own old copy.
          ref: ${{ github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run every guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The reading-line guard reads the pull request's body live.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base HEAD "$PR_BASE_SHA")"
          elif [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            base="$EVENT_BEFORE"
          else
            base="$(git rev-parse HEAD~1)"
          fi
          CHANGED_FILES="$(git diff --name-only --diff-filter=AMR "$base" HEAD -- docs/pool/items/)" npm run guards

  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
      unit_shards: ${{ steps.files.outputs.unit_shards }}
      unit_shard_count: ${{ steps.files.outputs.unit_shard_count }}
    steps:
      - name: Detect docs-only pull request
        id: files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          docs_only=false
          # A large change's test files are dealt out over up to six unit
          # jobs, about ten files each, so the run finishes inside its limit.
          shards=1
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
            if [[ -n "$files" ]] && ! grep -qvE '^(docs/.*|[^/]*\.md)$' <<<"$files"; then
              docs_only=true
            fi
            tests="$(grep -cE '\.test\.tsx?$' <<<"$files" || true)"
            shards=$(( (tests + 9) / 10 ))
            if (( shards < 1 )); then shards=1; fi
            if (( shards > 6 )); then shards=6; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "unit_shards=[$(seq -s, 1 "$shards")]" >> "$GITHUB_OUTPUT"
          echo "unit_shard_count=$shards" >> "$GITHUB_OUTPUT"

  unit:
    name: unit
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Owner rule (Oct 1, 2026): never run the full suite here. Run only the
    # test files this change adds or edits, the same rule the CTO's merge gate
    # uses. The full suite is the heavy set (.github/workflows/heavy.yml).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.unit_shards) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run only the changed test files
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.scope.outputs.unit_shard_count }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base HEAD "$PR_BASE_SHA")"
          elif [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            base="$EVENT_BEFORE"
          else
            base="$(git rev-parse HEAD~1)"
          fi
          # The sorted list is dealt out one file per job in turn, so every
          # changed test file runs in exactly one job.
          mapfile -t files < <(git diff --name-only --diff-filter=AMR "$base" HEAD \
            | grep -E '\.test\.tsx?$' \
            | grep -vE '^(tests/e2e|tests/caller-proofs|desktop|art/authoring)/' \
            | LC_ALL=C sort \
            | awk -v shard="$SHARD" -v shards="$SHARDS" '(NR - 1) % shards == shard - 1' || true)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No changed test files for job $SHARD of $SHARDS; nothing to run."
            exit 0
          fi
          printf 'Running %s changed test file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          npx vitest run "${files[@]}"

  # The menu look (owner, Nov 23: "explicitly forbid it. Make it turn main red"): a browser
  # opens every menu at 1440x900 and fails a box in a box or a scroll with free space that
  # tests/guards/ui-look-baseline.json does not list. Runs on every pull request and on
  # main's hourly run, so a violation on main turns validate red.
  ui-look:
    name: ui-look
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The baseline is compared with main's, so main's history is needed.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Start the bench
        shell: bash
        run: |
          set -euo pipefail
          nohup node --max-old-space-size=6144 --import tsx src/bench/server.ts > bench.log 2>&1 &
          for _ in $(seq 1 120); do
            if curl -sf http://localhost:3000/play > /dev/null; then exit 0; fi
            sleep 2
          done
          cat bench.log
          echo "The bench did not start."
          exit 1

      - name: Open every menu at 1440x900
        env:
          # The baseline only shrinks; a pull request body with a "CTO line:" lets it grow.
          UI_LOOK_GROWTH_APPROVED: ${{ contains(github.event.pull_request.body, 'CTO line:') }}
        run: npm run ui-look

  # Every test file and golden-path command must still load (npm run tests:load).
  # The unit job loads only the files a change touched, so a break in how any
  # other file loads is seen here, within the hour, on main's scheduled run.
  tests-load:
    name: tests-load
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Load every test file and golden-path command
        run: npm run tests:load

  validate:
    name: validate
    if: always()
    needs:
      - repository
      - guards
      - scope
      - unit
      - ui-look
      - tests-load
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every mandatory job
        shell: bash
        run: |
          set -euo pipefail
          repository='${{ needs.repository.result }}'
          guards='${{ needs.guards.result }}'
          unit='${{ needs.unit.result }}'
          echo "repository=$repository"
          echo "guards=$guards"
          echo "unit=$unit"
          ui_look='${{ needs.ui-look.result }}'
          echo "ui-look=$ui_look"
          if [[ "$ui_look" == "failure" || "$ui_look" == "cancelled" ]]; then
            echo "A menu draws a box in a box or scrolls with free space (npm run ui-look)."
            exit 1
          fi
          tests_load='${{ needs.tests-load.result }}'
          echo "tests-load=$tests_load"
          if [[ "$tests_load" == "failure" || "$tests_load" == "cancelled" ]]; then
            echo "A test file or golden-path command no longer loads (npm run tests:load)."
            exit 1
          fi
          docs_only='${{ needs.scope.outputs.docs_only }}'
          if [[ "$docs_only" == "true" && "$unit" == "skipped" ]]; then unit=success; fi
          if [[ "$repository" != "success" || "$guards" != "success" || "$unit" != "success" ]]; then
            echo "Aggregate validate succeeds only when every mandatory job succeeded."
            exit 1
          fi
