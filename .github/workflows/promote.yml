name: Promote

# Copies a passing commit of the work branch to main as ONE plain commit with
# every test file taken out (owner, Nov 15, 2026: "Two branches. All work and all
# tests go to a work branch, where every check runs. Main gets only the game:
# each time the work branch passes, its files are copied to main with every test
# file stripped. Builds come from main."). Read docs/coordination/TWO-BRANCHES.md.
#
# Two ways in:
#   - workflow_call, from release-package.yml: right after the release candidate
#     pushes its version commit to dev, with that commit's sha (work_sha). The
#     packaging jobs then build the Mac and Windows apps from the main commit
#     this workflow returns (main_sha).
#   - workflow_dispatch, by hand, the fallback: Actions > "Promote" > Run
#     workflow, or `gh workflow run promote.yml -f work_branch=dev -f push=true`.
#     The default is a dry run (push false): it builds the commit, prints the
#     counts and pushes nothing.
#
# The script (scripts/promote/promote.mjs) refuses unless the commit descends
# from the last promoted one, never forces, never rewrites history, and pushes
# a fast-forward only. A sha already promoted is found, not promoted twice, so a
# rerun after a failure picks up where the last run stopped. The push uses the
# same token the release workflow uses to push the version commit past branch
# protection (RELEASE_PUSH_TOKEN); without it the push is refused and nothing
# changes.

on:
  workflow_call:
    inputs:
      work_sha:
        description: The work-branch commit to promote (the release's version commit); it must be on dev.
        type: string
        required: true
    secrets:
      RELEASE_PUSH_TOKEN:
        description: The owner's token for pushing main past branch protection; the caller passes it.
        required: false
    outputs:
      main_sha:
        description: The main commit that carries work_sha (made now, or found from an earlier run).
        value: ${{ jobs.promote.outputs.main_sha }}
      superseded:
        description: "'true' when main already holds everything the work commit had, as part of a later promote; main_sha is then empty and nothing was pushed."
        value: ${{ jobs.promote.outputs.superseded }}
  workflow_dispatch:
    inputs:
      work_branch:
        description: The work branch to promote (its newest commit)
        required: true
        default: dev
      push:
        description: Push the promote commit to main (false is a dry run)
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  promote:
    name: Promote the work branch to main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One promote at a time, and a running one is never canceled. At job level
    # so it holds for a call from the release workflow as well as a manual run.
    concurrency:
      group: promote
      cancel-in-progress: false
    outputs:
      main_sha: ${{ steps.promote.outputs.main_sha }}
      superseded: ${{ steps.promote.outputs.superseded }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.work_sha || inputs.work_branch }}
          # The ancestor check and main's promote messages need history; file
          # contents are checked out, so the test rule can read them.
          fetch-depth: 0
          filter: blob:none
          # The release workflow's push token: branch protection refuses the
          # workflow token on main.
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Promote
        id: promote
        env:
          WORK_BRANCH: ${{ inputs.work_branch }}
          WORK_SHA: ${{ inputs.work_sha }}
          # A call from the release workflow always pushes; a manual run says so.
          PUSH: ${{ inputs.work_sha != '' && 'true' || inputs.push }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          if [[ -n "$WORK_SHA" ]]; then
            [[ "$WORK_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$(git rev-parse HEAD)" == "$WORK_SHA" ]]
            # Only a commit that is on dev is ever promoted.
            git fetch --no-tags origin dev
            git merge-base --is-ancestor "$WORK_SHA" origin/dev
            # Where this commit stands against main (read only).
            state="$(node scripts/promote/promote.mjs --state "$WORK_SHA")"
            read -r word first second <<< "$state"
            case "$word" in
              promoted)
                # An earlier run pushed it and a later step failed: use that
                # main commit and make no second one.
                echo "main_sha=$first" >> "$GITHUB_OUTPUT"
                echo "Main already holds $WORK_SHA as $first; nothing to promote." | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              superseded)
                # A later promote (for example a manual one of dev's tip) went
                # past this commit, so main has everything it had. Push nothing.
                echo "superseded=true" >> "$GITHUB_OUTPUT"
                echo "Version commit $WORK_SHA is already inside main as part of $second; this release gets no app of its own. The next release carries it." | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              pending) ;;
              *) echo "::error::Unexpected promote state: $state"; exit 1 ;;
            esac
          else
            [[ "$WORK_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
            [[ "$WORK_BRANCH" != "main" ]]
          fi
          args=(--work HEAD)
          if [[ "$PUSH" == "true" ]]; then args+=(--push); fi
          node scripts/promote/promote.mjs "${args[@]}" | tee "$RUNNER_TEMP/promote.txt"
          {
            echo '### Promote'
            echo
            echo '```'
            cat "$RUNNER_TEMP/promote.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PUSH" == "true" ]]; then
            # The main commit that carries this work commit, if there is one.
            # A manual run with nothing to promote has none, and that is fine;
            # a release run must have it.
            if main_sha="$(node scripts/promote/promote.mjs --find "$(git rev-parse HEAD)")"; then
              echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
            elif [[ -n "$WORK_SHA" ]]; then
              echo "::error::Promoted $WORK_SHA but main holds no commit for it."
              exit 1
            else
              echo "Nothing to promote: main already holds this commit's work." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
