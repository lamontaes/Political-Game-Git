name: New game
# The one check before a merge (owner, Nov 3, ruling 2): "a new game opens and
# runs briefly without crashing; nothing else holds a merge." One job, on the
# pull request merged with main (Actions' merge ref), in a town drawn from all
# 56 places. The log's first line is the replay number; replay a failure on
# main with `npm run new-game-check -- <replay number>` to see whose it is
# (ruling 3).
on:
  pull_request:
  workflow_dispatch:
    inputs:
      replay:
        description: "Replay number (blank draws one)"
        required: false
        default: ""
permissions:
  contents: read
# A newer push replaces the older run (owner rule, Oct 1, 2026).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    name: docs only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
    steps:
      - name: Detect docs-only pull request
        id: files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          docs_only=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # If the file list cannot be read, the game runs go ahead.
            files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[].filename')" || files=""
            if [[ -n "$files" ]] && ! grep -qvE '^(docs/.*|[^/]*\.md)$' <<<"$files"; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  new-game:
    name: new game
    needs: scope
    # Runs unless the pull request is docs only: a failed or skipped docs-only job never skips it.
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Open a new game and play four weeks
        env:
          OCD_STORAGE_OVERRIDE: "cloud session, owner approved Oct 14"
          NEW_GAME_REPLAY: ${{ github.event.inputs.replay }}
        run: npm run new-game-check
