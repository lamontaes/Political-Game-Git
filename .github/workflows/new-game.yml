name: New game
# The one check before a merge (owner, Nov 3, ruling 2): "a new game opens and
# runs briefly without crashing; nothing else holds a merge." One job, on the
# pull request merged with main (Actions' merge ref), in a town drawn from all
# 56 places. The log's first line is the replay number; replay a failure on
# main with `npm run new-game-check -- <replay number>` to see whose it is
# (ruling 3).
on:
  pull_request:
  workflow_dispatch:
    inputs:
      replay:
        description: "Replay number (blank draws one)"
        required: false
        default: ""
permissions:
  contents: read
# A newer push replaces the older run (owner rule, Oct 1, 2026).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    name: which checks apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.files.outputs.run }}
    steps:
      # Only the paths the graph reads are fetched: no pictures, one commit
      # (owner, Nov 18: whole-game checks run only for a change they play).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/
      - name: Read the import graph of each check
        id: files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          run=true
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" != train/* ]]; then
            files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[].filename')" || files=""
            if [[ -n "$files" ]]; then
              run="$(node scripts/ci/graph-scope.mjs --entries "scripts/new-game-check.ts" --always ".github/workflows/new-game.yml" <<<"$files" | tee /dev/stderr | sed -n 's/^run=//p')"
            fi
          fi
          echo "run=${run:-true}" >> "$GITHUB_OUTPUT"
  new-game:
    name: new game
    needs: scope
    # Runs only when the pull request changes a file the new game plays (scope job).
    if: ${{ !cancelled() && needs.scope.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Open a new game and play four weeks
        env:
          OCD_STORAGE_OVERRIDE: "cloud session, owner approved Oct 14"
          NEW_GAME_REPLAY: ${{ github.event.inputs.replay }}
        run: npm run new-game-check
