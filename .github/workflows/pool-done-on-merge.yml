name: Pool done on merge
# A merged pull request flips its pool item to done on main, so no merger step can be skipped.
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
# One group per pull request. A shared group lets GitHub hold only one pending
# run, and each newer merge cancelled the one waiting (303 of 400 runs on Oct
# 20-23), so the items stayed in-pr. The pool command's own fetch-and-retry on
# the push is what keeps two flips from racing for main.
concurrency:
  group: pool-done-on-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  flip:
    # Only merges into main finish an item; a fixer merged into another PR's branch does not.
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Flip the pool item to done
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          OCD_STORAGE_OVERRIDE: "cloud session, owner approved Oct 14"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node --import tsx scripts/pool/done-on-merge.ts
