name: Desktop packaging (read only)

# Packages the desktop client on real macOS and Windows runners and uploads
# the artifacts with checksums and exact source identity. This workflow is
# read only: no signing secrets, no publication, no GitHub Release, no
# update feed. Building here is not launch proof on that OS — a packaged
# executable is untested until actually launched — but a Windows runner
# build at least exercises NSIS on Windows itself.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-package.yml"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: "npx electron-builder --mac --arm64"
            name: mac-arm64
          - os: windows-latest
            command: "npx electron-builder --win --x64"
            name: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out the exact revision without write credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install game dependencies
        run: npm ci

      - name: Build the game
        run: npm run build

      - name: Install desktop shell dependencies
        run: npm ci --no-audit --no-fund
        working-directory: desktop

      - name: Stage compiled client with build identity
        run: node scripts/stage.mjs
        working-directory: desktop

      - name: Package (unsigned)
        env:
          # Internal unsigned builds: never look for signing identities here.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.command }}
        working-directory: desktop

      - name: Record checksums and source identity
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          cd release-artifacts
          rm -rf mac-arm64 win-unpacked builder-debug.yml || true
          {
            echo "source revision: $GITHUB_SHA"
            echo "workflow run: $GITHUB_RUN_ID"
            cat ../staged/build-identity.json
            shasum -a 256 * 2>/dev/null || sha256sum *
          } > SHA256SUMS-${{ matrix.name }}.txt
          cat SHA256SUMS-${{ matrix.name }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/release-artifacts/*
          retention-days: 14
