name: M0 guards
on:
  pull_request:
  # Main is checked once an hour, not on every push (owner, Oct 28: the CI
  # queue, see validate.yml). Every merge's pull request already ran this
  # workflow on the merged result.
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # The event is in the key so the nightly run on main is never canceled by
  # the next push to main; otherwise main never gets a golden-path verdict.
  group: m0-guard-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only a pull request run is replaced by a newer push; hourly and manual runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    name: which checks apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      golden: ${{ steps.files.outputs.golden }}
      paired: ${{ steps.files.outputs.paired }}
    steps:
      # Only the paths the graph reads are fetched: no pictures, one commit
      # (owner, Nov 18: whole-game checks run only for a change they play).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/
      - name: Read the import graph of each check
        id: files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          golden=true
          paired=true
          # A pull request runs a check only when it changes a file that check
          # plays. Train pull requests into main, pushes, the hourly run and
          # manual runs always run every check. If the file list cannot be
          # read, or the graph cannot be read, the check runs.
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" != train/* ]]; then
            files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[].filename')" || files=""
            if [[ -n "$files" ]]; then
              golden="$(node scripts/ci/graph-scope.mjs --entries "tests/golden-path/runner.mjs docs/roadmap/features.json scripts/core2-guard/policies.json" --always "tests/golden-path/ scripts/core2-guard/ .github/workflows/m0-guard.yml" <<<"$files" | tee /dev/stderr | sed -n 's/^run=//p')"
              paired="$(node scripts/ci/graph-scope.mjs --entries "scripts/core2-guard/paired.mjs scripts/core2-guard/month.mjs" --always "scripts/core2-guard/ .github/workflows/m0-guard.yml" <<<"$files" | tee /dev/stderr | sed -n 's/^run=//p')"
            fi
          fi
          echo "golden=${golden:-true}" >> "$GITHUB_OUTPUT"
          echo "paired=${paired:-true}" >> "$GITHUB_OUTPUT"
  golden-path:
    needs: scope
    # Runs only when the pull request changes a file the golden path plays (scope job).
    if: ${{ !cancelled() && needs.scope.outputs.golden != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35 # policies.json goldenJobMinutes; includes dependency setup
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Detector contract tests
        run: node --import tsx --test tests/golden-path/runner.node-test.mjs scripts/core2-guard/compare.node-test.mjs scripts/core2-guard/paired.node-test.mjs
      - name: Golden-path commands
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mode="--skip-long"
          if [ "$EVENT_NAME" = "schedule" ]; then mode="--nightly --skip-long"; fi
          node --import tsx tests/golden-path/runner.mjs $mode --output "$RUNNER_TEMP/golden-path.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-path
          path: ${{ runner.temp }}/golden-path.json
  # The played year (M0-13) takes most of a run's time, so it has its own job
  # and budget (policies.json longRunningMilliseconds) and cannot starve the quick specs.
  golden-path-year:
    needs: scope
    # Runs only when the pull request changes a file the golden path plays (scope job).
    if: ${{ !cancelled() && needs.scope.outputs.golden != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35 # policies.json goldenJobMinutes; includes dependency setup
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Golden-path long-running commands
        run: node --import tsx tests/golden-path/runner.mjs --only-long --output "$RUNNER_TEMP/golden-path-year.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-path-year
          path: ${{ runner.temp }}/golden-path-year.json
  core-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=false
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed=true
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- src/core2/ | grep -q .; then changed=true; fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
  paired-performance:
    needs: [scope, core-changes]
    if: ${{ !cancelled() && needs.scope.outputs.paired != 'false' && needs.core-changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50 # policies.json performanceJobMinutes; includes dependency setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Sequential same-host month comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ]; then base=$(git rev-parse "$HEAD_SHA^"); fi
          node --import tsx scripts/core2-guard/paired.mjs --base "$base" --head "$HEAD_SHA" --output "$RUNNER_TEMP/core2-paired.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core2-paired
          path: ${{ runner.temp }}/core2-paired.json
