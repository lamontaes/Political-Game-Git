<title>Words Batch 22 Read</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Instrument+Sans:wght@400;500;600&display=swap"
/>
<style>
  /* Layout: one script page at a time, read like a table read. The scene plays
   as you pick your lines from the buttons at the bottom; "Done, next" takes it
   out of the queue. Every line carries a short label (3.4) to name it in a
   voice note. */
  :root {
    --paper: #fbfaf6;
    --desk: #eceae3;
    --ink: #1d1f24;
    --ink-2: #5a5e68;
    --rule: #d9d6cc;
    --accent: #9b2c2c;
    --chip: #f1efe8;
    --you: #e6edf6;
    --lie: #f6e3c8;
    --ok: #2f6b3a;
    --script: "Courier Prime", "Courier New", Courier, monospace;
    --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1e2026;
      --desk: #15161a;
      --ink: #e8e6df;
      --ink-2: #a3a6ae;
      --rule: #33363e;
      --accent: #e08a8a;
      --chip: #2a2c33;
      --you: #1f2d40;
      --lie: #3a2f1c;
      --ok: #8fd19e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1e2026;
    --desk: #15161a;
    --ink: #e8e6df;
    --ink-2: #a3a6ae;
    --rule: #33363e;
    --accent: #e08a8a;
    --chip: #2a2c33;
    --you: #1f2d40;
    --lie: #3a2f1c;
    --ok: #8fd19e;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  /* A line held until the owner grades it: underlined, with its number in the batch. */
  .held {
    text-decoration: underline dotted var(--accent);
    text-underline-offset: 3px;
  }
  .heldtag {
    display: inline-block;
    margin-left: 0.4em;
    padding: 0 0.35em;
    border-radius: 3px;
    background: var(--chip);
    color: var(--accent);
    font: 600 0.7rem/1.5 var(--ui);
    text-decoration: none;
    white-space: nowrap;
  }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.5;
    /* A record id is one long word: it breaks rather than widen the page. */
    overflow-wrap: anywhere;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--desk);
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header {
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    align-items: baseline;
  }
  header h1 {
    font-family: var(--script);
    font-size: 1.05rem;
    margin: 0;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  header .q {
    font-size: 0.85rem;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  header .sp {
    flex: 1;
  }
  header button.link {
    background: none;
    border: 0;
    padding: 0;
    color: var(--ink-2);
    text-decoration: underline;
    cursor: pointer;
    font: inherit;
    font-size: 0.85rem;
  }
  .status {
    font-size: 0.78rem;
    color: var(--ink-2);
    width: 100%;
  }
  .status.warn {
    color: var(--accent);
  }
  .page {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 22px clamp(16px, 5vw, 44px) 28px;
    min-width: 0;
    align-self: start;
  }
  .slug {
    font-family: var(--script);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
  }
  .slug .n {
    color: var(--accent);
  }
  .sub {
    font-size: 0.8rem;
    color: var(--ink-2);
    margin: 0 0 18px;
  }
  .who-is p {
    margin: 0 0 4px;
  }
  .who-is ul {
    margin: 0 0 8px;
    padding-left: 18px;
  }
  .who-is {
    font-size: 0.82rem;
    color: var(--ink-2);
    margin: 0 0 16px;
    padding: 8px 10px;
    border-left: 3px solid var(--rule);
  }
  .action {
    font-family: var(--script);
    margin: 0 0 16px;
  }
  .cue {
    margin: 0 0 14px;
    display: grid;
    grid-template-columns: 3.2em 1fr;
    gap: 0 8px;
  }
  .ref {
    font-family: var(--ui);
    font-size: 0.72rem;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    padding-top: 3px;
    text-align: right;
  }
  .cue .who {
    font-family: var(--script);
    font-weight: 700;
    text-transform: uppercase;
    padding-left: 18%;
  }
  .cue .line {
    font-family: var(--script);
    margin: 0;
    padding-left: 8%;
    padding-right: 8%;
  }
  .cue.you .body {
    background: var(--you);
    border-radius: 4px;
    padding: 6px 0;
  }
  .cue.you.lie .body {
    background: var(--lie);
  }
  .tag {
    font-family: var(--ui);
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin-left: 8px;
  }
  .endmark {
    font-family: var(--script);
    text-align: center;
    margin: 22px 0 4px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .endmark small {
    display: block;
    font-family: var(--ui);
    text-transform: none;
    letter-spacing: 0;
    color: var(--ink-2);
    font-size: 0.82rem;
    margin-top: 4px;
  }
  footer {
    background: var(--desk);
    padding: 12px 0 calc(14px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--rule);
    display: grid;
    gap: 8px;
  }
  .prompt {
    font-size: 0.8rem;
    color: var(--ink-2);
  }
  .replies {
    display: grid;
    gap: 8px;
  }
  .replies button {
    text-align: left;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 10px 12px;
    font: inherit;
    color: var(--ink);
    cursor: pointer;
    min-height: 44px;
  }
  .replies button:hover {
    border-color: var(--ink-2);
  }
  .replies button .k {
    font-size: 0.72rem;
    color: var(--ink-2);
    margin-right: 8px;
    font-variant-numeric: tabular-nums;
  }
  .replies button.lie {
    border-style: dashed;
  }
  .nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .nav button {
    font: inherit;
    font-size: 0.9rem;
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
    min-height: 44px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
  }
  .nav button.primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    margin-left: auto;
  }
  .empty {
    text-align: center;
    padding: 60px 10px;
    font-family: var(--script);
  }
  .done-list {
    font-size: 0.85rem;
  }
  .done-list li {
    margin: 4px 0;
  }
  .done-list button {
    font: inherit;
    font-size: 0.8rem;
    margin-left: 8px;
  }
</style>

<div class="wrap">
  <header>
    <h1 id="h1">Table read</h1>
    <span class="q" id="q"></span>
    <span class="sp"></span>
    <button class="link" id="showDone" type="button">Finished scenes</button>
    <div class="status" id="status"></div>
  </header>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<script type="application/json" id="data">
  /*DATA*/ null
</script>
<script>
  (() => {
    const DATA = JSON.parse(document.getElementById("data").textContent);
    document.getElementById("h1").textContent =
      DATA.id.replace("batch-", "Batch ") + " table read";
    const $ = (s) => document.querySelector(s);
    function el(tag, attrs, kids) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null) continue;
        if (k === "text") n.textContent = v;
        else if (k === "class") n.className = v;
        else n.setAttribute(k, v);
      }
      for (const c of [].concat(kids || [])) if (c != null) n.append(c);
      return n;
    }
    const SCREENS = {
      desk: "the desk",
      filing: "the filing office",
      office: "your office",
      meeting: "the meeting",
      campaigns: "the campaign",
    };
    const OUTCOME = {
      resolved: "Resolved",
      refused: "Refused",
      open: "Left open",
    };
    const label = (s) => String(s || "").replace(/-/g, " ");
    // The batch's numbers of the held lines a piece of text says.
    const heldTag = (held) =>
      held && held.length
        ? el("span", { class: "heldtag", text: "held · " + held.join(", ") })
        : null;
    const letter = (k) =>
      k < 26 ? "abcdefghijklmnopqrstuvwxyz"[k] : String(k + 1);

    // Queue state: shared through the page's store, mirrored in this browser.
    let db = null,
      me = "";
    const done = new Map(); // scene id -> {done, path}
    try {
      for (const [k, v] of JSON.parse(
        localStorage.getItem("done:" + DATA.id) || "[]",
      ))
        done.set(k, v);
    } catch (e) {}
    const keep = () => {
      try {
        localStorage.setItem("done:" + DATA.id, JSON.stringify([...done]));
      } catch (e) {}
    };
    const setStatus = (t, warn) => {
      const s = $("#status");
      s.textContent = t;
      s.className = "status" + (warn ? " warn" : "");
    };

    let view = "queue";
    let current = null; // scene id on screen
    let path = []; // reply indexes picked so far
    const walked = new Map(); // scene id -> list of paths read, for voice-note context

    const queue = () => DATA.scenes.filter((s) => !(done.get(s.id) || {}).done);

    // Walk the tree along `path`, collecting what was said.
    function walk(scene, picks) {
      const said = [];
      let node = scene.root,
        turn = 0;
      const push = (node) =>
        node.lines.forEach((l) => said.push({ ...l, you: false }));
      push(node);
      for (const k of picks) {
        const r = node.replies[k];
        if (!r) break;
        said.push({
          ...r.line,
          you: true,
          lie: r.line.move === "lie",
          knows: r.knows,
        });
        node = r.next;
        push(node);
        turn++;
      }
      return { said, node };
    }

    async function save(scene, extra) {
      const id = DATA.id + ":" + scene.id;
      const prev = done.get(scene.id) || {};
      const next = {
        batch: DATA.id,
        scene: scene.id,
        n: scene.n,
        ...prev,
        ...extra,
        by: me,
        at: new Date().toISOString(),
      };
      done.set(scene.id, next);
      keep();
      if (!db) return;
      try {
        await db.collection("queue").doc(id).set(next);
      } catch (e) {
        setStatus(
          "That didn't save to the shared store (" +
            (e && e.code ? e.code : "error") +
            "). It's kept in this browser.",
          true,
        );
      }
    }

    function pathText(scene, picks) {
      return walk(scene, picks)
        .said.filter((l) => l.you)
        .map((l) => l.text);
    }

    function render() {
      const main = $("#main"),
        foot = $("#foot");
      main.textContent = "";
      foot.textContent = "";
      const q = queue();
      $("#q").textContent =
        q.length +
        " of " +
        DATA.scenes.length +
        " scenes left · " +
        DATA.place +
        (DATA.of
          ? " · " + DATA.shown + " of " + DATA.of + " held lines met"
          : "");
      $("#showDone").textContent =
        view === "done"
          ? "Back to the queue"
          : "Finished scenes (" + (DATA.scenes.length - q.length) + ")";

      if (view === "done") {
        const list = el("ul", { class: "done-list" });
        for (const s of DATA.scenes) {
          const d = done.get(s.id);
          if (!d || !d.done) continue;
          const b = el("button", {
            type: "button",
            text: "Put back in the queue",
          });
          b.addEventListener("click", async () => {
            await save(s, { done: false });
            render();
          });
          list.append(
            el("li", {}, [
              el("b", { text: "Scene " + s.n + " " }),
              label(s.purpose) + " — " + s.asker,
              b,
            ]),
          );
        }
        main.append(
          el(
            "div",
            { class: "page" },
            list.children.length
              ? list
              : el("p", { text: "No scenes finished yet." }),
          ),
        );
        return;
      }

      if (!q.length) {
        main.append(
          el("div", {
            class: "page empty",
            text: "That's every scene in this batch.",
          }),
        );
        return;
      }
      let scene = q.find((s) => s.id === current);
      if (!scene) {
        scene = q[0];
        current = scene.id;
        path = [];
      }

      const page = el("article", { class: "page" });
      page.append(
        el("div", { class: "slug" }, [
          el("span", { class: "n", text: "Scene " + scene.n }),
          el("span", { text: label(scene.purpose) }),
        ]),
      );
      page.append(
        el("p", {
          class: "sub",
          text: [
            label(scene.type),
            scene.key,
            "ends in " + scene.endpoint,
          ].join(" · "),
        }),
      );
      if (scene.who) page.append(el("p", { class: "who-is", text: scene.who }));
      // Who these two are and why the scene is happening, from the world's
      // records (owner, Oct 19), so a line can be judged against the relationship.
      if (scene.context) {
        const c = scene.context;
        const person = (lead, who) =>
          el("div", {}, [
            el("p", { text: lead + who.name }),
            el(
              "ul",
              {},
              (who.facts || [who.role]).map((t) => el("li", { text: t })),
            ),
          ]);
        page.append(
          el("div", { class: "who-is" }, [
            person("You play ", c.asked),
            person("Across from you: ", c.asker),
            el("p", { text: "Between you: " + c.relation + "." }),
            el("p", { text: "Why this scene: " + c.why.join("; ") + "." }),
          ]),
        );
      }
      scene.narration.forEach((t, k) => {
        const row = typeof t === "string" ? { text: t } : t;
        const held = row.held && row.held.length;
        page.append(
          el("div", { class: "cue" }, [
            el("span", { class: "ref", text: scene.n + "." + letter(k) }),
            el("p", { class: "action" }, [
              el("span", { class: held ? "held" : null, text: row.text }),
              heldTag(row.held),
            ]),
          ]),
        );
      });

      const { said, node } = walk(scene, path);
      said.forEach((l, k) => {
        const c = el(
          "div",
          { class: "cue" + (l.you ? " you" : "") + (l.lie ? " lie" : "") },
          [
            el("span", { class: "ref", text: scene.n + "." + (k + 1) }),
            el("div", { class: "body" }, [
              el(
                "div",
                { class: "who", text: l.you ? "You" : l.speaker },
                l.lie
                  ? el("span", {
                      class: "tag",
                      text:
                        "a lie" +
                        (l.knows === true
                          ? ", and " + scene.asker + " knows"
                          : l.knows === false
                            ? ", and " + scene.asker + " doesn't know"
                            : ""),
                    })
                  : null,
              ),
              el("p", { class: "line" }, [
                el("span", {
                  class: l.held && l.held.length ? "held" : null,
                  text: l.text,
                }),
                heldTag(l.held),
              ]),
            ]),
          ],
        );
        page.append(c);
      });

      if (!node.replies || !node.replies.length) {
        const o = node.end ? node.end.outcome : "open";
        page.append(
          el(
            "div",
            {
              class: "endmark",
              text:
                node.end && node.end.ending
                  ? node.end.ending.label +
                    (node.end.ending.opens
                      ? " · opens " +
                        (SCREENS[node.end.ending.opens] ||
                          node.end.ending.opens)
                      : "")
                  : OUTCOME[o] || o,
            },
            el("small", {
              text:
                path.length +
                (path.length === 1 ? " reply" : " replies") +
                " from you. Go back to try a different line, or mark it done.",
            }),
          ),
        );
        const seen = walked.get(scene.id) || [];
        const key = path.join(".");
        if (!seen.includes(key)) {
          seen.push(key);
          walked.set(scene.id, seen);
          save(scene, {
            paths: seen.map((p) =>
              pathText(scene, p.split(".").filter(Boolean).map(Number)),
            ),
          });
        }
      }
      main.append(page);

      // Bottom: your lines, then the controls.
      if (node.replies && node.replies.length) {
        foot.append(el("div", { class: "prompt", text: "You say:" }));
        const box = el("div", { class: "replies" });
        node.replies.forEach((r, k) => {
          const tagText =
            r.line.move === "lie"
              ? r.knows === true
                ? "lie · " +
                  scene.asker +
                  " has heard otherwise" +
                  (r.source ? " from " + r.source : "")
                : r.knows === false
                  ? "lie · " + scene.asker + " hasn't heard"
                  : "lie"
              : "";
          const b = el(
            "button",
            { type: "button", class: r.line.move === "lie" ? "lie" : "" },
            [
              el("span", { class: "k", text: String(k + 1) }),
              // A reply drawn from your own life, tagged like "[Out of work]".
              r.line.tag ? "[" + r.line.tag + "] " : null,
              el("span", {
                class: r.line.held && r.line.held.length ? "held" : null,
                text: r.line.text,
              }),
              heldTag(r.line.held),
              tagText ? el("span", { class: "tag", text: tagText }) : null,
            ],
          );
          b.addEventListener("click", () => {
            path.push(k);
            render();
            window.scrollTo({
              top: document.body.scrollHeight,
              behavior: "smooth",
            });
          });
          box.append(b);
        });
        foot.append(box);
      }
      const nav = el("div", { class: "nav" });
      const back = el("button", { type: "button", text: "Back a line" });
      back.disabled = !path.length;
      back.addEventListener("click", () => {
        path.pop();
        render();
      });
      const restart = el("button", { type: "button", text: "Start over" });
      restart.disabled = !path.length;
      restart.addEventListener("click", () => {
        path = [];
        render();
        window.scrollTo(0, 0);
      });
      const next = el("button", {
        type: "button",
        class: "primary",
        text: q.length > 1 ? "Done, next scene" : "Done",
      });
      next.addEventListener("click", async () => {
        await save(scene, { done: true });
        current = null;
        path = [];
        render();
        window.scrollTo(0, 0);
      });
      nav.append(back, restart, next);
      foot.append(nav);
    }

    $("#showDone").addEventListener("click", () => {
      view = view === "done" ? "queue" : "done";
      render();
    });
    render();

    (async () => {
      try {
        const user = window.claude ? await window.claude.use("user") : null;
        me = user ? await user.id() : "";
        db = window.claude ? await window.claude.use("db") : null;
        if (!db) {
          setStatus("Your place in the queue is kept in this browser only.");
          return;
        }
        db.collection("queue")
          .where("batch", "==", DATA.id)
          .onSnapshot(
            (snap) => {
              for (const d of snap.docs) {
                const v = d.data();
                if (v && v.scene) done.set(v.scene, v);
              }
              keep();
              render();
            },
            () =>
              setStatus(
                "Lost the connection to the shared store. Your place is kept in this browser.",
                true,
              ),
          );
      } catch (e) {
        setStatus("Your place in the queue is kept in this browser only.");
      }
    })();
  })();
</script>
